<!-- The console (docs/adr/0047, 0055): seven screens over one document,
     the logbook, read from /v1/logbook.json. Every value on these screens
     is a field of the logbook (docs/plans/console.md names each one); the
     page computes no verdict of its own. Two inputs: go-for-launch, a POST
     to /v1/go-for-launch, which runs core/promote.sh; and the answer to a
     ticket's open question, a POST to /v1/answer, which runs ./go answer's
     recipe (docs/adr/0055 §2). No build, no asset
     from the network. Built by the session on 2026-11-04, not from a Stitch
     design (console/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lights-out console</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #17202a; --muted: #5b6673; --line: #dde2e8;
  --go: #13795b; --go-bg: #e3f4ec; --nogo: #b42318; --nogo-bg: #fde8e6;
  --wait: #8a5a00; --wait-bg: #fdf3dc; --none: #5b6673; --none-bg: #eef0f3; --accent: #1d4ed8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419; --panel: #171e26; --ink: #e6ebf0; --muted: #9aa6b2; --line: #2a3440;
    --go: #4cc38a; --go-bg: #12301f; --nogo: #ff7b72; --nogo-bg: #3a1513;
    --wait: #e3b341; --wait-bg: #33280e; --none: #9aa6b2; --none-bg: #222b35; --accent: #79a8ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; max-width: 1180px; margin: 0 auto; }
.brand { font-weight: 700; letter-spacing: .02em; }
.meta { color: var(--muted); font-size: 13px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1180px; margin: 10px auto 0; }
nav a { padding: 6px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
nav a.on { background: var(--none-bg); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 4px 0 4px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
.lede { color: var(--muted); margin: 0 0 14px; }
.banner { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; border: 1px solid var(--line); background: var(--panel); }
.banner.warn { background: var(--wait-bg); border-color: transparent; color: var(--ink); }
.banner.err { background: var(--nogo-bg); border-color: transparent; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.mono, code, pre { font-family: var(--mono); font-size: 13px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; background: var(--bg); padding: 10px; border-radius: 6px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.GO { color: var(--go); background: var(--go-bg); }
.NO-GO, .stranded { color: var(--nogo); background: var(--nogo-bg); }
.pending, .needs-human { color: var(--wait); background: var(--wait-bg); }
.none { color: var(--none); background: var(--none-bg); }
.muted { color: var(--muted); }
a { color: var(--accent); }
.unread { color: var(--nogo); font-size: 13px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 6px 0 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; }
button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.go { background: var(--go); color: #fff; border-color: transparent; }
button.nogo { background: var(--nogo); color: #fff; border-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.cards { display: grid; gap: 14px; }
textarea { font: inherit; width: 100%; min-height: 70px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.placeholder { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.count { font-size: 24px; font-weight: 700; }
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { flex: 0 0 190px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 0 0 8px; color: var(--ink); text-decoration: none; font-size: 13px; }
.lane { margin: 0 0 14px; }
.lane h2 { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">lights-out console</span>
    <span class="meta" id="who">reading…</span>
    <span class="meta" id="fresh"></span>
  </div>
  <nav id="nav">
    <a href="#overview" data-s="overview">Overview</a>
    <a href="#kanban" data-s="kanban">Kanban</a>
    <a href="#tickets" data-s="tickets">This week's tickets</a>
    <a href="#incidents" data-s="incidents">Incidents and post mortems</a>
    <a href="#launch" data-s="launch">Go-for-launch</a>
    <a href="#thresholds" data-s="thresholds">Thresholds</a>
  </nav>
</header>
<main id="main"><p class="muted">Reading the logbook…</p></main>
<script>
"use strict";
let book = null, con = null, lastLine = null, busy = false, windowDays = null, answerLine = null;
let kFeature = "", kPriority = "", kGroup = "";

// h(tag, attrs, ...children): every text goes through a text node, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

// A ticket's name: the logbook's title already starts with the id when it
// comes from the ticket's first line.
const named = (t) => String(t.title).startsWith(t.id) ? t.title : t.id + " — " + t.title;

function ticketsList() { return Array.isArray(book.tickets) ? book.tickets : []; }

// --- overview (docs/adr/0055 §6) --------------------------------------
const ORDER = ["requested", "questions", "spec-ready", "opened", "pr-opened", "review", "ci-passed", "ci-failed",
  "needs-human", "merged", "main-green", "held", "rolled-back"];

}

    states.filter((st) => all.some((t) => t.state === st)).map((st) => h("div", {},

      h("div", {}, all.filter((t) => t.state === st).map((t) => h("div", {}, h("a", {href: "#ticket/" + encodeURIComponent(t.id)}, named(t))))))))));

    unread(held) ? err(held) : !Array.isArray(held) ? h("p", {cls: "muted"}, "This logbook has no perimeters_held.")

      held.map((x) => h("tr", {}, h("td", {}, h("a", {href: "#ticket/" + encodeURIComponent(x.ticket)}, x.ticket)), h("td", {}, shown(x.state)),
        h("td", {cls: "mono"}, x.globs.join("  ·  ")), h("td", {}, x.holding ? h("span", {cls: "chip pending"}, "yes") : "no: its PR is not open"))))

    unread(docs) ? err(docs) : !Array.isArray(docs) ? h("p", {cls: "muted"}, "This logbook has no docs_to_realign.")
    : docs.length ? h("table", {}, h("tr", {}, ["Merged ticket", "Merge", "Docs ticket", "Its state"].map((c) => h("th", {}, c))),
      docs.map((d) => h("tr", {}, h("td", {}, d.ticket), h("td", {cls: "mono"}, shown(d.merge_sha)),
        h("td", {}, d.docs_ticket_state ? h("a", {href: "#ticket/" + encodeURIComponent(d.docs_ticket)}, d.docs_ticket) : d.docs_ticket),
        h("td", {}, shown(d.docs_ticket_state) === "—" ? "not opened by the tower" : d.docs_ticket_state))))
      : h("p", {cls: "muted"}, "No merge has left docs to realign.")));
  return out;
}

// --- kanban (docs/adr/0055 §7) -----------------------------------------
// The columns and the order inside them are the logbook's (`kanban`): the
// page filters and groups, and never moves a card. No drag-and-drop, no
// button on a card: a card moves when the tower moves its ticket.
function card(t) {
  return h("a", {cls: "card", href: "#ticket/" + encodeURIComponent(t.id)},
    h("div", {}, h("b", {}, named(t))),
    h("div", {cls: "muted"}, h("span", {cls: "chip " + (t.priority ? "pending" : "none")}, t.priority || "unprioritised"), " ",
      t.feature || "no feature"),
    t.wait ? h("div", {cls: "muted"}, waitLine(t.wait)) : null,
    t.outcome && t.outcome.verdict !== "pending" ? h("div", {}, chip(t.outcome.verdict)) : null);
}
function screenKanban() {

    h("p", {cls: "lede"}, "One column per tower state. A card moves only when the tower moves its ticket; feature and priority change by editing the ticket.")];

  if (!Array.isArray(book.kanban)) return out.concat(h("div", {cls: "panel"}, h("p", {cls: "muted"}, "This logbook has no kanban (written before 1.1).")));

    " Priority ", sel(kPriority, [["", "all"], ["P0", "P0"], ["P1", "P1"], ["P2", "P2"], ["P3", "P3"], ["-", "unprioritised"]], (v) => { kPriority = v; }),

      col.tickets.filter((id) => byId[id] && inLane(byId[id])).map((id) => card(byId[id])))));

      lane === null ? null : h("h2", {}, lane || (kGroup === "priority" ? "unprioritised" : "no feature")),

  }

}

// --- screen 1 ----------------------------------------------------------
function screenTickets() {
  const out = [h("h1", {}, "This week's tickets"),
    h("p", {cls: "lede"}, "Did each change get through, and if not, which judge stopped it and with what line.")];
  if ((book.source || {}).level === "l0" && con.mode === "live")
    out.push(h("div", {cls: "banner warn"}, "The tower is in memory at L0: tickets from before the last ./go down are not here (ADR 0047 §2)."));
  if (unread(book.tickets)) return out.concat(h("div", {cls: "panel"}, err(book.tickets)));
  if (windowDays === null) windowDays = con.mode === "snapshot" ? 0 : 7;
  const pick = h("select", {onchange: (e) => { windowDays = Number(e.target.value); render(); }},
    [[7, "last 7 days"], [30, "last 30 days"], [0, "all"]].map(([v, t]) => h("option", {value: v, selected: v === windowDays}, t)));
  out.push(h("p", {cls: "muted"}, "Window, by this browser's clock: ", pick));
  const since = windowDays ? Date.now() - windowDays * 86400e3 : 0;
  const rows = ticketsList().filter((t) => !since || (t.updated_at && Date.parse(t.updated_at) >= since))
    .sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
  if (!rows.length) return out.concat(h("div", {cls: "panel"}, h("p", {cls: "muted"}, "No ticket touched in this window.")));
  out.push(h("div", {cls: "panel"}, h("table", {},
    h("tr", {}, ["Ticket", "Outcome", "Decided by", "Why, in one line", "State", "Attempts", "Last activity", "Cost"].map((c) => h("th", {}, c))),
    rows.map((t) => h("tr", {},
      h("td", {}, h("a", {href: "#ticket/" + encodeURIComponent(t.id)}, t.id), " ", t.title,
        t.origin ? h("div", {cls: "muted"}, "from " + t.origin) : null),
      h("td", {}, chip(t.outcome.verdict)),
      h("td", {}, shown(t.outcome.judge)),
      h("td", {cls: "mono"}, shown(t.outcome.line)),
      h("td", {}, t.state),
      h("td", {}, shown(t.attempt)),
      h("td", {cls: "mono"}, shown(t.updated_at)),
      h("td", {}, cost(t.task)))))));

}
function cost(task) {
  if (!task) return "—";
  const tokens = task.tokens && task.tokens.total;
  const parts = [];
  if (tokens !== undefined && tokens !== null) parts.push(Number(tokens).toLocaleString("en") + " tokens");
  if (task.duration_s !== null && task.duration_s !== undefined) parts.push(task.duration_s + " s");
  if (!parts.length) return "—";
  return parts.join(", ") + (task.replayed ? " (recorded, replayed)" : "");

// --- screen 2: one ticket's timeline (docs/adr/0055 §6) ----------------
const VERDICTS = {"waiting": "pending", "spec-ready": "GO", "questions": "pending", "ci-passed": "GO", "ci-failed": "NO-GO", "review": "pending",
  "merged": "GO", "main-green": "GO", "rolled-back": "NO-GO", "held": "GO", "failed": "stranded", "approved": "GO", "changes-requested": "NO-GO"};

    ["Tokens", r.tokens && r.tokens.total], ["Duration", r.duration_s === null || r.duration_s === undefined ? null : r.duration_s + " s"],

    const body = await r.json().catch(() => ({}));
    answerLine = body.line || ("refused (" + r.status + "): " + (body.error || r.statusText));

    h("p", {}, h("b", {}, qs[last].from === "spec" ? "The spec gate: " : "The product role: "), qs[last].question),

    h("div", {cls: "buttons"}, h("button", {cls: "go", disabled: busy || con.mode === "snapshot",

    h("p", {cls: "lede"}, "Every phase from the request to the release, one row each, each from its record. Check it against the code host: ",

    h("div", {cls: "panel"}, h("p", {}, chip(t.outcome.verdict), " ", shown(t.outcome.judge), ": ", h("span", {cls: "mono"}, shown(t.outcome.line)))),
    answerPanel(t),
    h("div", {cls: "panel"}, rows.length ? h("table", {}, h("tr", {}, ["Phase", "Verdict", "What", "At", "Record"].map((c) => h("th", {}, c))),
      rows.map((r) => h("tr", {}, h("td", {}, r.phase), h("td", {}, r.verdict ? chip(VERDICTS[r.verdict] || r.verdict) : "—"),

      : h("p", {cls: "muted"}, "This logbook has no timeline (written before 1.1).")),
    t.spec && (t.spec.criteria || []).length ? h("div", {cls: "panel"}, h("h2", {}, "The spec's criteria (" + shown(t.spec.by) + ")"),
      h("ol", {}, t.spec.criteria.map((c) => h("li", {}, c)))) : null,
    h("h2", {}, "History"),
    h("div", {cls: "panel"}, h("table", {}, h("tr", {}, ["Step", "State", "Attempt", "At", "Error"].map((c) => h("th", {}, c))),
      t.history.map((e) => h("tr", {}, h("td", {}, e.step), h("td", {}, e.state), h("td", {}, shown(e.attempt)), h("td", {cls: "mono"}, shown(e.at)), h("td", {cls: "mono"}, shown(e.error))))))];
}

// --- screen 3 ----------------------------------------------------------
function screenIncidents() {
  const out = [h("h1", {}, "Incidents and post mortems"),
    h("p", {cls: "lede"}, "What went wrong in production, the evidence behind each step, and the fix tickets it filed.")];
  if (unread(book.postmortems)) return out.concat(h("div", {cls: "panel"}, err(book.postmortems)));
  if (!book.postmortems.length) return out.concat(h("div", {cls: "panel"}, h("p", {cls: "muted"},
    "No post mortem recorded. ./go postmortem INCIDENT=<file> writes one; ./go demo-postmortem names the recording it needs.")));
  for (const pm of book.postmortems) {
    const rel = pm.release || {};
    out.push(h("div", {cls: "panel"},
      h("h2", {}, pm.name + ": " + pm.title),
      dl([["Window", shown(pm.window && pm.window.from) + " to " + shown(pm.window && pm.window.to)],
        ["Release", shown(rel.version) + " (" + shown(rel.verdict) + "), stable " + shown(rel.stable)],
        ["Chain", pm.chain ? h("span", {}, h("a", {href: "#ticket/" + encodeURIComponent(pm.chain.ticket)}, "ticket " + pm.chain.ticket), ", PR #" + pm.chain.pr + ", merge " + pm.chain.merge) : "not released by the tower"],
        ["Written by", (pm.run.replayed ? "replayed, recorded by " : "") + shown(pm.run.provider) + " " + shown(pm.run.model)]]),
      h("h2", {}, "Timeline"),
      h("ul", {}, pm.timeline.map((e) => h("li", {}, e.event, " ", h("code", {}, e.anchor), e.evidence.length ? h("pre", {}, e.evidence.join("\n")) : null))),
      h("h2", {}, "Contributing causes"),
      h("ul", {}, pm.causes.map((c) => h("li", {}, c.cause, h("div", {cls: "muted"}, c.evidence)))),
      h("h2", {}, "Action items"),
      h("table", {}, h("tr", {}, ["#", "Action", "Fix ticket", "Its state"].map((c) => h("th", {}, c))),
        pm.actions.map((a) => {
          const t = ticketsList().find((x) => x.id === a.ticket);
          return h("tr", {}, h("td", {}, a.n), h("td", {}, a.title),
            h("td", {}, t ? h("a", {href: "#ticket/" + encodeURIComponent(a.ticket)}, a.ticket) : a.ticket),
            h("td", {}, t ? chip(t.outcome.verdict) : "not opened yet: waiting for a human to declare the perimeter"));
        }))));
  }
  return out;
}

// --- screen 4 ----------------------------------------------------------
async function pressAnswer(answer) {
  const L = book.launch, rec = L.record;
  if (answer !== "PREPARE") {
    const first = (L.brief.text.split("\n").find((l) => l.trim()) || "").replace(/^#+\s*/, "");
    if (!confirm(answer + " for " + rec.version + "?\n\n" + first + "\n\n" + (answer === "GO" ? "100% of traffic goes to the canary." : "The canary is rolled back."))) return;
  }
  busy = true; render();
  try {
    const r = await fetch("/v1/go-for-launch", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({answer, version: rec.version, held_at: rec.held_at, brief_sha256: L.brief ? L.brief.sha256 : null})});
    const body = await r.json().catch(() => ({}));
    lastLine = body.line || ("refused (" + r.status + "): " + (body.error || r.statusText));
  } catch (e) { lastLine = "the console did not answer: " + e; }
  busy = false; await load();
}
function screenLaunch() {
  const L = book.launch, rec = L.record;
  const out = [h("h1", {}, "Go-for-launch"),
    h("p", {cls: "lede"}, "The one human decision before 100% of traffic. The same check and the same script as ./go promote.")];
  if (!rec || unread(rec)) out.push(h("div", {cls: "panel"}, rec ? err(rec) : h("p", {cls: "muted"}, "No release record yet.")));
  else {
    const answered = rec.promoted ? ["GO", rec.promoted] : rec.rejected ? ["NO-GO", rec.rejected] : null;
    out.push(h("div", {cls: "panel"},
      dl([["Version", rec.version], ["Stable", rec.stable], ["Image", h("span", {cls: "mono"}, shown(rec.image))],
        ["Verdict", rec.verdict], ["Held at", rec.held_at === null ? null : rec.held_at + "%"],
        answered ? ["Answered", h("span", {}, chip(answered[0]), " by " + shown(answered[1].by) + " via " + shown(answered[1].via) + " at " + shown(answered[1].at))] : null]),
      (rec.stages || []).length ? h("table", {}, h("tr", {}, h("th", {}, "Stage"), h("th", {}, "Verdict"), h("th", {}, "Numbers")),
        rec.stages.map((st) => h("tr", {}, h("td", {}, st.pct + "%"), h("td", {cls: "mono"}, st.verdict), h("td", {cls: "mono"}, st.numbers.join("\n"))))) : null));
  }
  const p = L.plane;
  out.push(h("h2", {}, "What the plane runs now"), h("div", {cls: "panel"}, unread(p) ? err(p) : dl([["Stable", p.stable], ["Canary", p.canary], ["Canary weight", p.weight === null ? null : p.weight + "%"]])));
  out.push(h("h2", {}, "The brief"), h("div", {cls: "panel"}, L.brief
    ? h("div", {}, h("p", {cls: "muted"}, "By " + shown(L.brief.author) + " · sha256 ", h("span", {cls: "mono"}, L.brief.sha256)), h("pre", {}, L.brief.text))
    : h("p", {cls: "muted"}, "No brief on disk.")));
  const reasons = [];
  if (!con.can_launch && con.reason) reasons.push(con.reason);
  if (L.disabled_reason) reasons.push(L.disabled_reason);
  const can = con.can_launch && !busy;
  out.push(h("h2", {}, "Answer"), h("div", {cls: "panel"},
    reasons.length ? h("p", {}, "Disabled: ", reasons.join("; ")) : h("p", {}, "Pressing answers the brief above, as " + shown(con.identity === "loopback" ? "unauthenticated (loopback)" : con.identity) + "."),
    h("div", {cls: "buttons"},
      L.preparable ? h("button", {onclick: () => pressAnswer("PREPARE"), disabled: !can}, "Prepare the brief") : null,
      h("button", {cls: "go", onclick: () => pressAnswer("GO"), disabled: !(can && L.pressable)}, "GO — promote to 100%"),
      h("button", {cls: "nogo", onclick: () => pressAnswer("NO-GO"), disabled: !(can && L.pressable)}, "NO-GO — roll back")),
    busy ? h("p", {cls: "muted"}, "core/promote.sh is running…") : null,
    lastLine ? h("pre", {}, lastLine) : null));
  return out;
}

// --- screen 5 ----------------------------------------------------------
function screenThresholds() {
  const out = [h("h1", {}, "Thresholds"),
    h("p", {cls: "lede"}, "Every number that can stop a change, where it is set, and why it has that value.")];
  if (unread(book.thresholds)) return out.concat(h("div", {cls: "panel"}, err(book.thresholds)));
  out.push(h("div", {cls: "panel"}, h("table", {},
    h("tr", {}, ["Key", "Value", "Judges", "Set in", "Provenance"].map((c) => h("th", {}, c))),
    book.thresholds.map((t) => h("tr", {},
      h("td", {cls: "mono"}, t.key), h("td", {cls: "mono"}, t.value), h("td", {}, t.judge),
      h("td", {cls: "mono"}, t.file + (t.overridden ? " (overrides the platform)" : "")),
      h("td", {}, t.provenance ? h("span", {}, h("b", {}, t.provenance.kind + ": "), t.provenance.text) : h("span", {cls: "chip NO-GO"}, "undeclared")))))));
  return out;
}

// --- frame -------------------------------------------------------------
function render() {
  const main = document.getElementById("main");
  if (!book || !con) return;
  const src = book.source || {};
  document.getElementById("who").textContent = [src.workload || "?", "level " + (src.level || "?"),
    con.mode === "snapshot" ? "snapshot of " + (src.commit || "?").slice(0, 12) + ", no plane behind it" : "live",
    con.identity ? "as " + con.identity : null].filter(Boolean).join(" · ");
  document.getElementById("fresh").textContent = con.mode === "live" ? "read at " + (con.read_at || "—") : "";
  const hash = decodeURIComponent(location.hash.slice(1)) || "overview";
  const [screen, arg] = hash.split("/");
  for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.s === screen || (screen === "ticket" && a.dataset.s === "tickets"));
  let body;
  if (screen === "ticket") body = screenTicket(arg);
  else if (screen === "incidents") body = screenIncidents();
  else if (screen === "launch") body = screenLaunch();
  else if (screen === "thresholds") body = screenThresholds();
  else if (screen === "overview") body = screenOverview();
  else if (screen === "kanban") body = screenKanban();
  else body = screenTickets();
  const banners = [];
  if (con.read_error) banners.push(h("div", {cls: "banner err"}, "Stale: the last read failed (" + con.read_error + "); showing the last good logbook."));
  main.replaceChildren(...banners, ...body.filter(Boolean));
}
async function load() {
  try {
    const [c, b] = await Promise.all([fetch("/v1/console.json").then((r) => r.json()), fetch("/v1/logbook.json").then((r) => r.ok ? r.json() : null)]);
    con = c; if (b) book = b;
  } catch (e) { /* keep what is shown; the header says when it was read */ }
  if (!book) {
    document.getElementById("main").textContent = "No logbook yet" + (con && con.read_error ? ": " + con.read_error : "; the first read is still running.");
    return;
  }
  if (!busy) render();
}
window.addEventListener("hashchange", render);
load();
setInterval(() => { if (con && con.mode === "live") load(); }, 2000);
</script>
</body>
</html>
