<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The console (docs/adr/0047, 0055, 0059): ten screens over one
     document, the logbook, read from /v1/logbook.json. Every value on these
     screens is a field of the logbook (docs/plans/console.md names each
     one); the page computes no verdict of its own: the spec check's line is
     gates/spec.sh's, through /v1/spec-check, which writes nothing. Three
     inputs: go-for-launch, a POST to /v1/go-for-launch, which runs
     core/promote.sh; the answer to a ticket's open question, a POST to
     /v1/answer, which runs ./go answer's recipe (docs/adr/0055 §2); and a
     new ticket's request, a POST to /v1/request, which runs ./go request's
     recipe (docs/adr/0059 §4). The kanban moves no card: every interaction
     changes the view, never a column (docs/adr/0059 §1). The theme is the
     colour tokens and nothing else (§2). No build, no asset from the
     network. Built by hand, not from a Stitch design (console/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lights-out console</title>
<style>
/* The theme (docs/adr/0059 §2) is these tokens and nothing else: light by
   default, dark when the system asks and no choice says light, or when the
   choice says dark. */
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --ink: #17202a; --muted: #5b6673; --line: #dde2e8;
  --go: #13795b; --go-bg: #e3f4ec; --nogo: #b42318; --nogo-bg: #fde8e6;
  --wait: #8a5a00; --wait-bg: #fdf3dc; --none: #5b6673; --none-bg: #eef0f3; --accent: #1d4ed8;
  --focus: #1d4ed8; --moved: #fff3b0; --shadow: rgba(23, 32, 42, .18);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1419; --panel: #171e26; --ink: #e6ebf0; --muted: #9aa6b2; --line: #2a3440;
    --go: #4cc38a; --go-bg: #12301f; --nogo: #ff7b72; --nogo-bg: #3a1513;
    --wait: #e3b341; --wait-bg: #33280e; --none: #9aa6b2; --none-bg: #222b35; --accent: #79a8ff;
    --focus: #79a8ff; --moved: #4a3f0e; --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1419; --panel: #171e26; --ink: #e6ebf0; --muted: #9aa6b2; --line: #2a3440;
  --go: #4cc38a; --go-bg: #12301f; --nogo: #ff7b72; --nogo-bg: #3a1513;
  --wait: #e3b341; --wait-bg: #33280e; --none: #9aa6b2; --none-bg: #222b35; --accent: #79a8ff;
  --focus: #79a8ff; --moved: #4a3f0e; --shadow: rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; max-width: 1180px; margin: 0 auto; }
.brand { font-weight: 700; letter-spacing: .02em; }
.meta { color: var(--muted); font-size: 13px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1180px; margin: 10px auto 0; }
nav a { padding: 6px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
nav a.on { background: var(--none-bg); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
main.wide { max-width: none; }
h1 { font-size: 20px; margin: 4px 0 4px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
.lede { color: var(--muted); margin: 0 0 14px; }
.banner { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; border: 1px solid var(--line); background: var(--panel); }
.banner.warn { background: var(--wait-bg); border-color: transparent; color: var(--ink); }
.banner.err { background: var(--nogo-bg); border-color: transparent; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.mono, code, pre { font-family: var(--mono); font-size: 13px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; background: var(--bg); padding: 10px; border-radius: 6px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.GO { color: var(--go); background: var(--go-bg); }
.NO-GO, .stranded { color: var(--nogo); background: var(--nogo-bg); }
.pending, .needs-human { color: var(--wait); background: var(--wait-bg); }
.none { color: var(--none); background: var(--none-bg); }
.muted { color: var(--muted); }
a { color: var(--accent); }
.unread { color: var(--nogo); font-size: 13px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 6px 0 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; }
button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.go { background: var(--go); color: #fff; border-color: transparent; }
button.nogo { background: var(--nogo); color: #fff; border-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.cards { display: grid; gap: 14px; }
textarea { font: inherit; width: 100%; min-height: 70px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.placeholder { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.count { font-size: 24px; font-weight: 700; }
/* The board fits the flow (docs/adr/0063 §1): the columns, in the logbook's
   order, under four bands; a column with no card in the view is narrow and
   the columns with cards share the width. Provenance, decision: 40 px holds
   a column's toggle and its state written sideways; 140 px holds a card's
   id, a two-line title and its now line; together they fit the golden's
   board in the site's 1440 px desktop capture (site/render.py). */
.board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; align-items: stretch; }
.band { display: flex; flex-direction: column; flex: 0 0 auto; }
.band.wide { flex: 1 1 0; }
/* width 0, min-width 100%: a band's name never widens its columns. */
.band-name { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 6px; padding-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 0; min-width: 100%; }
.band-cols { display: flex; gap: 6px; flex: 1; }
.col { flex: 1 1 140px; min-width: 140px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.col.collapsed, .col.empty { flex: 0 0 40px; min-width: 40px; padding: 8px 4px; }
.col.collapsed h3, .col.empty h3 { margin: 0; writing-mode: vertical-rl; }
.col.collapsed .col-toggle { writing-mode: horizontal-tb; }
.col.empty .col-toggle { display: none; }
.now { display: block; margin: 4px 0 2px; font-size: 13px; color: var(--muted); }
.now[data-turn="you"] { color: var(--wait); font-weight: 700; }
.now[data-turn="stopped"] { color: var(--nogo); }
.now a.act { font-weight: 700; margin-left: 4px; }
.nowbox { border-left: 4px solid var(--line); padding: 6px 0 6px 12px; margin: 0 0 12px; }
.nowbox[data-turn="you"] { border-color: var(--wait); }
.nowbox[data-turn="stopped"] { border-color: var(--nogo); }
.nowbox .now { font-size: 15px; margin: 0; }
ol.stages { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 12px; }
ol.stages li { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--none-bg); color: var(--none); }
ol.stages li[data-mark="done"] { background: var(--go-bg); color: var(--go); }
ol.stages li[data-mark="now"] { background: var(--wait-bg); color: var(--wait); outline: 2px solid var(--wait); }
ol.stages li[data-mark="stopped"] { background: var(--nogo-bg); color: var(--nogo); }
ol.stages li[data-mark="skipped"] { background: transparent; border: 1px dashed var(--line); }
tr.band-row th { color: var(--ink); font-size: 13px; text-transform: none; letter-spacing: 0; background: var(--bg); }
td.at { white-space: nowrap; }
.savebar { position: sticky; bottom: 0; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin: 0 0 14px;
  box-shadow: 0 -6px 18px var(--shadow); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.savebar .buttons { margin: 0 0 0 auto; }
.savebar #spec-line { flex: 1 1 320px; }
.yours li { margin: 0 0 6px; }
@media (max-width: 720px) {
  /* Provenance, decision (docs/adr/0063 §1): below 720 px two of the
     golden's bands with cards no longer fit side by side, and one column
     under another reads better than a sideways scroll. */
  nav { flex-wrap: nowrap; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .board, .band-cols { flex-direction: column; }
  .band, .band.wide { flex: none; }
  .col, .col.collapsed, .col.empty { flex: none; min-width: 0; width: auto; }
  .col.collapsed h3, .col.empty h3 { writing-mode: horizontal-tb; }
  #kanban-q, #adr-q { min-width: 0; width: 100%; }
}
.col-toggle { padding: 0 6px; font-size: 12px; line-height: 18px; border-radius: 4px; font-weight: 700; }
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 0 0 8px; color: var(--ink); text-decoration: none; font-size: 13px; cursor: pointer; }
.card:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.card.selected { border-color: var(--focus); }
.card.moved { background: var(--moved); animation: arrive .6s ease-out; }
@keyframes arrive { from { transform: translateX(-24px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.moved { animation: none; } }
.lane { margin: 0 0 14px; }
.lane h2 { margin-top: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 12px; color: var(--muted); font-size: 14px; }
input[type=search], input[type=text] { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
#kanban-q, #adr-q { min-width: 260px; }
aside#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px var(--shadow); padding: 16px; overflow-y: auto; z-index: 10; }
aside#drawer h2 { margin-top: 0; }
.theme { margin-left: auto; }
.editor label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
.editor input[type=text], .editor textarea { width: 100%; }
.criterion { display: grid; grid-template-columns: max-content 1fr; gap: 4px 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 0 0 8px; }
.criterion .muted { font-size: 13px; }
.adr { border-bottom: 1px solid var(--line); padding: 10px 0; }
.adr:last-child { border-bottom: 0; }
.links { font-size: 13px; color: var(--muted); }
.links code { margin-right: 6px; }
</style>
<script>
// The theme before the first paint (docs/adr/0059 §2): the browser's choice,
// or the system's when there is none or storage is refused.
(function () {
  let t = "system";
  try { t = localStorage.getItem("lights-out.theme") || "system"; } catch (e) { /* storage refused */ }
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">lights-out console</span>
    <span class="meta" id="who">reading…</span>
    <span class="meta" id="fresh"></span>
    <label class="meta theme">Theme <select id="theme" aria-label="Theme">
      <option value="system">system</option><option value="light">light</option><option value="dark">dark</option>
    </select></label>
  </div>
  <nav id="nav">
    <a href="#overview" data-s="overview">Overview</a>
    <a href="#kanban" data-s="kanban">Kanban</a>
    <a href="#tickets" data-s="tickets">This week's tickets</a>
    <a href="#specs" data-s="specs">Specs</a>
    <a href="#request" data-s="request">New request</a>
    <a href="#adrs" data-s="adrs">ADRs</a>
    <a href="#incidents" data-s="incidents">Incidents and post mortems</a>
    <a href="#launch" data-s="launch">Go-for-launch</a>
    <a href="#thresholds" data-s="thresholds">Thresholds</a>
  </nav>
</header>
<main id="main"><p class="muted">Reading the logbook…</p></main>
<!-- The tower's transition table, as board/index.html embeds it (docs/adr/
     0035), with who runs each step and the bands the columns sit under
     (docs/adr/0063 §2). ./go ci proves next equal to core/tower.py's,
     who naming every step of its PRECONDITION and no other, and the bands
     holding core/logbook.py's COLUMNS in their order. The page reads no
     other copy, and no sentence carries a number of its own. -->
<script type="application/json" id="tower-machine">
{"next": {"requested": "clarify", "spec-ready": "spec", "opened": "assign", "pr-opened": "ci", "review": "review", "ci-passed": "merge", "merged": "mainline", "main-green": "release", "ci-failed": "rework"},
 "who": {"clarify": "The product role reads the request: a question, or the criteria confirmed",
         "answer": "The product role reads the answer: a question, or the criteria confirmed",
         "spec": "The spec gate checks the criteria",
         "assign": "The dev-worker takes it and opens a PR",
         "ci": "The gates judge the PR",
         "review": "The reviewer reads the diff",
         "merge": "The merge step merges the PR",
         "mainline": "Main's check runs after the merge",
         "release": "The canary goes out, each stage verified before the next",
         "rework": "The dev-worker reworks it with the verdict"},
 "bands": [{"band": "spec", "name": "Spec", "states": ["requested", "questions", "spec-ready"]},
           {"band": "build", "name": "Build", "states": ["opened", "pr-opened"]},
           {"band": "test", "name": "Test and review", "states": ["review", "ci-passed", "ci-failed", "needs-human"]},
           {"band": "release", "name": "Release", "states": ["merged", "main-green", "held", "rolled-back"]}]}
</script>
<script>
"use strict";
let book = null, con = null, lastLine = null, busy = false, windowDays = null, answerLine = null;
let etag = null;

// h(tag, attrs, ...children): every text goes through a text node, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "cls") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
// A ticket's name: the logbook's title already starts with the id when it
// comes from the ticket's first line.
const named = (t) => String(t.title).startsWith(t.id) ? t.title : t.id + " — " + t.title;
const unread = (v) => v && typeof v === "object" && !Array.isArray(v) && v.ok === false;
const shown = (v) => (v === null || v === undefined || v === "") ? "—" : v;
function chip(verdict) {
  const cls = ["GO", "NO-GO", "pending", "needs-human", "stranded"].includes(verdict) ? verdict : "none";
  return h("span", {cls: "chip " + cls}, verdict || "not reached");
}
function err(v) { return h("span", {cls: "unread"}, "could not read: " + v.error); }
function dl(pairs) {
  return h("dl", {}, pairs.filter(Boolean).map(([k, v]) => [h("dt", {}, k), h("dd", {}, v instanceof Node ? v : shown(v))]));
}
function ticketsList() { return Array.isArray(book.tickets) ? book.tickets : []; }
function releasesList() { return Array.isArray(book.releases) ? book.releases : []; }

// --- whose turn it is (docs/adr/0063 §2) ----------------------------------
// One sentence per ticket from its state and the logbook's own fields,
// through the tower's table embedded above: who has the ball and what it
// waits for. A person's turn says so, with the one thing to do. It is a
// reading of the record, never a verdict: the columns stay the logbook's.
const MACHINE = JSON.parse(document.getElementById("tower-machine").textContent);
const BANDS = MACHINE.bands;
const bandOf = (state) => (BANDS.find((b) => b.states.includes(state)) || {band: "other"}).band;
const bandName = (band) => (BANDS.find((b) => b.band === band) || {name: "Other"}).name;
function reworkMax() {
  const t = Array.isArray(book.thresholds) ? book.thresholds.find((x) => x.key === "REWORK_MAX_ATTEMPTS") : null;
  return t && /^[0-9]+$/.test(String(t.value)) ? Number(t.value) : null;
}
function openQuestion(t) {
  const qs = t.questions || [];
  const q = qs[qs.length - 1];
  return t.state === "questions" && q && !q.answer ? q : null;
}
// {turn: you | tower | done | stopped, text, href, act}
function now(t) {
  const out = t.outcome || {};
  const id = t.id, n = t.attempt;
  const history = Array.isArray(t.history) ? t.history : [];
  const last = history[history.length - 1] || {};
  const resume = "./go resume TICKET=" + id;
  // A failed step strands the ticket (ADR 0034): it waits for the tickets
  // holding its files, or for a person to resume it.
  if (out.verdict === "stranded" || t.wait) {
    if (t.wait && t.wait.holders.length) return {turn: "stopped", text: "Waits for " + t.wait.holders.join(", ") + " to release its files, then " + resume};
    return {turn: "you", text: "Your turn: " + (t.wait ? "assign was refused (the base, or a missing perimeter)" : shown(last.step) + " stopped (" + shown(out.line) + ")") + "; resume it with",
      code: resume};
  }
  const q = openQuestion(t);
  if (q) return {turn: "you", text: "Your turn: answer the " + (q.from === "spec" ? "spec gate's" : "product role's") + " question",
    href: "#ticket/" + encodeURIComponent(id), act: "Answer it"};
  if (t.state === "needs-human") return {turn: "you", text: "Your turn: " + shown(n) + " attempts used, the last stopped by the " + (out.judge === "review" ? "reviewer" : shown(out.judge)) + "; a person decides",
    href: "#ticket/" + encodeURIComponent(id), act: "See the attempts"};
  if (t.state === "held") {
    if (out.judge === "human") return {turn: "done", text: out.verdict === "GO" ? "Done: at 100%, " + out.line : "Done: " + out.line + ", the canary rolled back"};
    const L = book.launch || {}, rec = L.record && !unread(L.record) ? L.record : null;
    const rel = t.release || {};
    if (rec && rel.version && rec.version === rel.version && !rec.promoted && !rec.rejected)
      return {turn: "you", text: "Your turn: go-for-launch, the canary holds at " + shown(rec.held_at) + "%", href: "#launch", act: "Go-for-launch"};
    return {turn: "done", text: "Held with no answer; the launch record now belongs to another version"};
  }
  if (t.state === "rolled-back") return {turn: "done", text: "Rolled back automatically: " + shown(out.line)};
  if (t.state === "questions") return {turn: "tower", text: MACHINE.who.answer};
  const step = MACHINE.next[t.state];
  if (!step) return {turn: "tower", text: "At " + t.state + ": the tower's table requests no step from it"};
  const max = reworkMax();
  if (step === "rework" && max !== null && Number(n) >= max) return {turn: "tower", text: "The rework step hands it to a person: attempt " + n + " was the last of " + max};
  if (step === "rework") return {turn: "tower", text: MACHINE.who.rework + ", attempt " + (Number(n || 1) + 1) + (max !== null ? " of " + max : "")};
  if ((step === "ci" || step === "review") && n) return {turn: "tower", text: MACHINE.who[step] + ", attempt " + n};
  return {turn: "tower", text: MACHINE.who[step]};
}
function nowLine(t) {
  const w = now(t);
  return h("span", {cls: "now", "data-turn": w.turn}, w.text, w.code ? [" ", h("code", {}, w.code)] : null,
    w.href ? h("a", {cls: "act", href: w.href, onclick: (e) => e.stopPropagation()}, w.act + " →") : null);
}

// --- overview (docs/adr/0055 §6) --------------------------------------
const ORDER = ["requested", "questions", "spec-ready", "opened", "pr-opened", "review", "ci-passed", "ci-failed",
  "needs-human", "merged", "main-green", "held", "rolled-back"];
function waitLine(w) {
  return "waiting since " + shown(w.since) + ", " + w.refusals + " refused assign" + (w.refusals > 1 ? "s" : "") +
    (w.holders.length ? "; held by " + w.holders.join(", ") : "; no open ticket holds its files: the base, or a missing perimeter (./go resume)");
}
function screenOverview() {
  const out = [h("h1", {}, "Overview"),
    h("p", {cls: "lede"}, "What waits for a person first; then every ticket the tower holds, by where it is in the flow; the files open tickets hold; the docs a merge left to realign. ",
      h("a", {href: "#kanban"}, "The kanban →"))];
  if (unread(book.tickets)) return out.concat(h("div", {cls: "panel"}, err(book.tickets)));
  const all = ticketsList();
  // Waiting for you (docs/adr/0063 §4): exactly the tickets whose now line is a person's turn.

  return h("div", {cls: "adr", "data-number": a.number},
    h("div", {}, h("a", {href: "#adr/" + a.number}, h("b", {}, a.title))),
    h("div", {cls: "muted"}, "Status: " + (a.status || "none").slice(0, 160)),
    q ? h("div", {cls: "links"}, snippet(a, q)) : null,
    h("div", {cls: "links"}, "Files: ", a.files.length ? a.files.slice(0, 12).map((f) => h("code", {}, f)) : "none",
      a.files.length > 12 ? " and " + (a.files.length - 12) + " more" : ""),
    h("div", {cls: "links"}, "Tickets: ", a.tickets.length ? a.tickets.map((id) => [tickets[id] ? h("a", {href: "#ticket/" + id}, id) : id, " "]) : "none",
      " · ADRs: ", a.adrs.length ? a.adrs.map((n) => [h("a", {href: "#adr/" + n}, n), " "]) : "none"));
}
function drawAdrs() {
  const area = document.getElementById("adr-results");
  if (!area) return;
  const q = route().query.q || "";
  const found = adrSearch(q);
  area.replaceChildren(h("p", {cls: "muted"}, found.length + " of " + adrItems().length + " ADRs"), ...found.map((a) => adrRow(a, q)));
}
function screenAdrs() {
  const out = [h("h1", {}, "ADRs"),
    h("p", {cls: "lede"}, "The project's decisions, from the project map (./go map): search by number, a word of the title, the status, the text, or a file one cites.")];
  if (unread(book.adrs)) return out.concat(h("div", {cls: "panel"}, err(book.adrs)));
  if (!book.adrs) return out.concat(h("div", {cls: "panel"}, h("p", {cls: "muted"}, "This logbook has no adrs (written before 1.2).")));
  const q = route().query.q || "";
  out.push(h("div", {cls: "controls"},
    h("input", {type: "search", id: "adr-q", value: q, placeholder: "0055, kanban, proposed, core/spec.py", "aria-label": "Search the ADRs",
      oninput: (e) => { history.replaceState(null, "", viewHash("adrs", {q: e.target.value}, ["q"])); drawAdrs(); }}),
    h("span", {}, "map built at ", h("span", {cls: "mono"}, shown(book.adrs.map_sha).slice(0, 12)))),
    h("div", {cls: "panel", id: "adr-results"}));
  return out;
}
function screenAdr(n) {
  const a = adrItems().find((x) => x.number === n);
  if (!a) return [h("h1", {}, "ADR " + n), h("div", {cls: "panel"}, unread(book.adrs) ? err(book.adrs) : "This ADR is not in the project map.")];
  return [h("h1", {}, a.title), h("p", {cls: "lede"}, h("a", {href: "#adrs"}, "← every ADR"), " · ", h("code", {}, a.path)),
    h("div", {cls: "panel"}, adrRow(a, "")), h("div", {cls: "panel"}, h("pre", {}, a.text))];
}

// --- frame -------------------------------------------------------------
// The theme switch (docs/adr/0059 §2): tokens on <html data-theme>, kept in
// the browser when it lets us; no screen reads it.
const themeSelect = document.getElementById("theme");
function storedTheme() {
  try { return localStorage.getItem("lights-out.theme") || "system"; } catch (e) { return document.documentElement.dataset.theme || "system"; }
}
themeSelect.value = ["light", "dark"].includes(storedTheme()) ? storedTheme() : "system";
themeSelect.addEventListener("change", () => {
  const t = themeSelect.value;
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("lights-out.theme", t); } catch (e) { /* storage refused: this page keeps it until it closes */ }
});

function header() {
  const src = book.source || {};
  document.getElementById("who").textContent = [src.workload || "?", "level " + (src.level || "?"),
    con.mode === "snapshot" ? "snapshot of " + (src.commit || "?").slice(0, 12) + ", no plane behind it" : "live",
    con.identity ? "as " + con.identity : null].filter(Boolean).join(" · ");
  document.getElementById("fresh").textContent = con.mode === "live" ? "read at " + (con.read_at || "—") : "";
}
// Which element had the focus, and where its caret was, so a redraw can
// give them back.
function focusMark() {
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  const all = el.name ? [...document.querySelectorAll('[name="' + CSS.escape(el.name) + '"]')] : [];
  return {id: el.id, name: el.name, index: all.indexOf(el), card: el.classList.contains("card") ? el.dataset.id : null,
    start: el.selectionStart, end: el.selectionEnd};
}
function refocus(m) {
  if (!m) return;
  let el = m.card ? document.querySelector('.card[data-id="' + CSS.escape(m.card) + '"]')
    : m.id ? document.getElementById(m.id)
    : m.name ? document.querySelectorAll('[name="' + CSS.escape(m.name) + '"]')[m.index] : null;
  if (!el) return;
  el.focus();
  try { if (m.start !== null && m.start !== undefined) el.setSelectionRange(m.start, m.end); } catch (e) { /* not a text field */ }
}
function render() {
  const main = document.getElementById("main");
  if (!book || !con) return;
  header();
  const {screen, arg} = route();
  for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.s === screen ||
    (screen === "ticket" && a.dataset.s === "kanban") || (screen === "adr" && a.dataset.s === "adrs"));
  let body;
  if (screen === "ticket") body = screenTicket(arg);
  else if (screen === "incidents") body = screenIncidents();
  else if (screen === "launch") body = screenLaunch();
  else if (screen === "thresholds") body = screenThresholds();
  else if (screen === "overview") body = screenOverview();
  else if (screen === "kanban") body = screenKanban();
  else if (screen === "specs") body = screenSpecs();
  else if (screen === "request") body = screenRequest();
  else if (screen === "adrs") body = screenAdrs();
  else if (screen === "adr") body = screenAdr(arg);
  else body = screenTickets();
  const banners = [];
  if (con.read_error) banners.push(h("div", {cls: "banner err"}, "Stale: the last read failed (" + con.read_error + "); showing the last good logbook."));
  const mark = focusMark();
  main.classList.toggle("wide", screen === "kanban");
  main.replaceChildren(...banners, ...body.filter(Boolean));
  if (screen === "kanban") drawBoard();
  if (screen === "adrs") drawAdrs();
  if (screen === "request") { showCheck(); if (!lastCheck && draftFields.title) scheduleCheck(); }
  refocus(mark);
}
// The logbook is fetched with its ETag: an unchanged one costs no body and
// no redraw (docs/adr/0059 §1). The editor is redrawn only by its own
// inputs, so a refresh never takes a keystroke.
async function load() {
  let changed = false;
  try {
    const [c, r] = await Promise.all([fetch("/v1/console.json").then((x) => x.json()),
      fetch("/v1/logbook.json", {headers: etag ? {"If-None-Match": etag} : {}})]);
    con = c;
    if (r.status === 200) {
      const b = await r.json();
      etag = r.headers.get("ETag");
      if (book) noteMoves(book, b);
      book = b; changed = true;
    }
  } catch (e) { /* keep what is shown; the header says when it was read */ }
  if (!book) {
    document.getElementById("main").textContent = "No logbook yet" + (con && con.read_error ? ": " + con.read_error : "; the first read is still running.");
    return false;
  }
  return changed;
}
async function tick() {
  const changed = await load();
  if (!book || busy) return;
  if (changed && route().screen !== "request") render(); else header();
}
window.addEventListener("hashchange", () => { render(); });
load().then(() => render());
setInterval(() => { if (con && con.mode === "live") tick(); }, 2000);
</script>
