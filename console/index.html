<!-- The console (docs/adr/0047, 0055, 0059, 0071): eleven screens over one
     document, the logbook, read from /v1/logbook.json. Every value on these
     screens is a field of the logbook (docs/plans/console.md names each
     one); the page computes no verdict of its own: the spec check's line is
     gates/spec.sh's, through /v1/spec-check, which writes nothing. Three
     inputs: go-for-launch, a POST to /v1/go-for-launch, which runs
     core/promote.sh; the answer to a ticket's open question, a POST to
     /v1/answer, which runs ./go answer's recipe (docs/adr/0055 §2); and a
     new ticket's request, a POST to /v1/request, which runs ./go request's
     recipe (docs/adr/0059 §4); a client's words, a POST to /v1/intake, and
     the decisions on its proposed tickets, a POST to /v1/intake-confirm,
     which run ./go intake's and ./go intake-confirm's recipes (docs/adr/0090 §8). The kanban moves no card: every interaction
     changes the view, never a column (docs/adr/0059 §1). The theme is the
     colour tokens and nothing else (§2). No build, no asset from the
     network. Built by hand, not from a Stitch design (console/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lights-out console</title>
<style>
/* The theme (docs/adr/0059 §2) is these tokens and nothing else: light by
   default, dark when the system asks and no choice says light, or when the
   choice says dark. */
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --ink: #17202a; --muted: #5b6673; --line: #dde2e8;
  --go: #13795b; --go-bg: #e3f4ec; --nogo: #b42318; --nogo-bg: #fde8e6;
  --wait: #8a5a00; --wait-bg: #fdf3dc; --none: #5b6673; --none-bg: #eef0f3; --accent: #1d4ed8;
  --focus: #1d4ed8; --moved: #fff3b0; --shadow: rgba(23, 32, 42, .18);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* The kanban (docs/adr/0068 §1, §6): a tinted board, lists, white cards;
     the bands' rules avoid the GO, waiting and NO-GO hues; six feature
     label colours and four priority ones, each pair at least 4.5:1. */
  --board: #e4e9f2; --list: #f1f3f6; --card: #ffffff; --card-shadow: rgba(9, 30, 66, .22); --mark: #ffe58a; --mark-ink: #17202a;
  --band-spec: #7c5cff; --band-build: #2f6fde; --band-test: #0e8f8f; --band-release: #c2378a; --band-other: #8792a0;
  --hue0: #d3f1df; --hue0-ink: #0f5132; --hue1: #fbefb5; --hue1-ink: #5c4400; --hue2: #fde2c8; --hue2-ink: #7a3500;
  --hue3: #fbd5d2; --hue3-ink: #8a1c12; --hue4: #e7dcfb; --hue4-ink: #4b2a8a; --hue5: #d6e4ff; --hue5-ink: #1a3f8f;
  --scrim: rgba(9, 15, 25, .5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1419; --panel: #171e26; --ink: #e6ebf0; --muted: #9aa6b2; --line: #2a3440;
    --go: #4cc38a; --go-bg: #12301f; --nogo: #ff7b72; --nogo-bg: #3a1513;
    --wait: #e3b341; --wait-bg: #33280e; --none: #9aa6b2; --none-bg: #222b35; --accent: #79a8ff;
    --focus: #79a8ff; --moved: #3a320b; --shadow: rgba(0, 0, 0, .5);
    --board: #121922; --list: #19212b; --card: #232d39; --card-shadow: rgba(0, 0, 0, .55); --mark: #ffe58a; --mark-ink: #17202a;
    --band-spec: #a58bff; --band-build: #6b9bff; --band-test: #3fc1c1; --band-release: #f06fbd; --band-other: #6b7684;
    --hue0: #12452b; --hue0-ink: #b6f0cd; --hue1: #4a3a06; --hue1-ink: #fbe7a1; --hue2: #4f2a0b; --hue2-ink: #fdd2a8;
    --hue3: #5a1d18; --hue3-ink: #ffc9c3; --hue4: #3b2766; --hue4-ink: #ddd0fb; --hue5: #1c3566; --hue5-ink: #c9dbff;
    --scrim: rgba(0, 0, 0, .65);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1419; --panel: #171e26; --ink: #e6ebf0; --muted: #9aa6b2; --line: #2a3440;
  --go: #4cc38a; --go-bg: #12301f; --nogo: #ff7b72; --nogo-bg: #3a1513;
  --wait: #e3b341; --wait-bg: #33280e; --none: #9aa6b2; --none-bg: #222b35; --accent: #79a8ff;
  --focus: #79a8ff; --moved: #3a320b; --shadow: rgba(0, 0, 0, .5);
  --board: #121922; --list: #19212b; --card: #232d39; --card-shadow: rgba(0, 0, 0, .55); --mark: #ffe58a; --mark-ink: #17202a;
  --band-spec: #a58bff; --band-build: #6b9bff; --band-test: #3fc1c1; --band-release: #f06fbd; --band-other: #6b7684;
  --hue0: #12452b; --hue0-ink: #b6f0cd; --hue1: #4a3a06; --hue1-ink: #fbe7a1; --hue2: #4f2a0b; --hue2-ink: #fdd2a8;
  --hue3: #5a1d18; --hue3-ink: #ffc9c3; --hue4: #3b2766; --hue4-ink: #ddd0fb; --hue5: #1c3566; --hue5-ink: #c9dbff;
  --scrim: rgba(0, 0, 0, .65);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; max-width: 1180px; margin: 0 auto; }
.brand { font-weight: 700; letter-spacing: .02em; }
.meta { color: var(--muted); font-size: 13px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1180px; margin: 10px auto 0; }
nav a { padding: 6px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
nav a.on { background: var(--none-bg); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
main.wide { max-width: none; }
h1 { font-size: 20px; margin: 4px 0 4px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
.lede { color: var(--muted); margin: 0 0 14px; }
.banner { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; border: 1px solid var(--line); background: var(--panel); }
.banner.warn { background: var(--wait-bg); border-color: transparent; color: var(--ink); }
.banner.err { background: var(--nogo-bg); border-color: transparent; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.mono, code, pre { font-family: var(--mono); font-size: 13px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; background: var(--bg); padding: 10px; border-radius: 6px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.GO { color: var(--go); background: var(--go-bg); }
.NO-GO, .stranded { color: var(--nogo); background: var(--nogo-bg); }
.pending, .needs-human { color: var(--wait); background: var(--wait-bg); }
.none { color: var(--none); background: var(--none-bg); }
.muted { color: var(--muted); }
a { color: var(--accent); }
.unread { color: var(--nogo); font-size: 13px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 6px 0 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; }
button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.go { background: var(--go); color: #fff; border-color: transparent; }
button.nogo { background: var(--nogo); color: #fff; border-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.cards { display: grid; gap: 14px; }
textarea { font: inherit; width: 100%; min-height: 70px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.placeholder { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.count { font-size: 24px; font-weight: 700; }
/* Delivery and spend (docs/adr/0082, 0083, amendments of 2026-11-13). */
.dora-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 8px 0 0; }
.dora-measure { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.dora-measure[data-measured="false"] { border-style: dashed; color: var(--muted); }
.spend-lines { margin: 4px 0 0; padding-left: 18px; overflow-wrap: anywhere; }
.spend-lines li { margin: 2px 0; }
#spend-summary { font-weight: 700; margin: 0 0 8px; }
/* The role matrix (docs/adr/0086 §2) and the burn (docs/adr/0087 §5). */
#role-matrix td.tokens { white-space: nowrap; }
#role-matrix meter, span.live meter { display: block; width: 100%; max-width: 160px; height: 8px; margin-top: 4px; }
#roles-summary { margin: 0 0 8px; font-weight: 600; }
#spend-hours { display: block; width: 100%; max-width: 480px; height: 40px; margin: 6px 0; }
#spend-hours rect.hour { fill: var(--accent); }
#spend-hours rect.hour[data-zero] { fill: var(--line); }
#spend-projection[data-over="true"] { background: var(--wait-bg); color: var(--ink); border-radius: 6px; padding: 6px 10px; font-weight: 600; }
span.live { display: inline-flex; flex-direction: column; font-size: 12px; font-family: var(--mono); color: var(--muted); min-width: 64px; }
span.live[data-warn="true"] { color: var(--wait); background: var(--wait-bg); border-radius: 4px; padding: 0 4px; font-weight: 700; }
span.live meter { height: 5px; margin-top: 2px; }
.live-line { margin: 6px 0; font-size: 14px; }
.live-line[data-warn="true"] { background: var(--wait-bg); color: var(--ink); border-radius: 6px; padding: 6px 10px; }
/* The flow strip (docs/adr/0085 §6): the console's verdict tokens, already
   AA in both themes, and a mark that is not colour alone. On a card's face a
   compact row of segments; on its back and its timeline a row of tab stops,
   each with its reason shown on hover and on focus. */
ol.flow { list-style: none; display: flex; gap: 2px; padding: 0; margin: 8px 0 0; }
ol.flow .flow-node[data-verdict="GO"] { background: var(--go-bg); color: var(--go); }
ol.flow .flow-node[data-verdict="NO-GO"] { background: var(--nogo-bg); color: var(--nogo); }
ol.flow .flow-node[data-verdict="running"] { background: var(--wait-bg); color: var(--wait); }
ol.flow .flow-node[data-verdict="not-reached"] { background: var(--none-bg); color: var(--none); }
/* A grid of fourteen tracks that can shrink to nothing: the strip never widens the card. */
ol.flow:not(.flow-detail) { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); contain: inline-size; }
ol.flow:not(.flow-detail) .flow-node { min-width: 0; height: 16px; border-radius: 3px; font-size: 11px; font-weight: 700;
  line-height: 16px; text-align: center; overflow: hidden; }
ol.flow-detail { position: relative; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
ol.flow-detail .flow-node { padding: 3px 9px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
ol.flow-detail .flow-node:focus { outline: 2px solid var(--focus); outline-offset: 2px; }
ol.flow-detail .flow-node[aria-haspopup] { cursor: pointer; text-decoration: underline; }
.flow-time { font-family: var(--mono); font-size: 12px; font-weight: 400; margin-left: 4px; }
.flow-verdict { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flow-why { display: none; position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; z-index: 5; padding: 8px 10px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px var(--shadow);
  font-size: 13px; font-weight: 400; white-space: normal; overflow-wrap: anywhere; }
ol.flow-detail .flow-node:hover .flow-why, ol.flow-detail .flow-node:focus .flow-why { display: block; }
#ticket-now { overflow: visible; }
/* The board fits the flow (docs/adr/0063 §1): the columns, in the logbook's
   order, under four bands; a column with no card in the view is narrow and
   the columns with cards share the width. Provenance, decision: 40 px holds
   a column's toggle and its state written sideways; 140 px holds a card's
   id, a two-line title and its now line; together they fit the golden's
   board in the site's 1440 px desktop capture (site/render.py). */
.board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; align-items: stretch; }
/* Trello's look (docs/adr/0068 §1): lists on a tinted board, white cards
   with a soft shadow, a thin coloured rule over each band's name. The
   widths are ADR 0063's: nothing here widens a column. */
.board-wrap { background: var(--board); border-color: transparent; }
.band { display: flex; flex-direction: column; flex: 0 0 auto; border-top: 3px solid var(--band-other); padding-top: 6px; border-radius: 2px; }
.band[data-band="spec"] { border-top-color: var(--band-spec); }
.band[data-band="build"] { border-top-color: var(--band-build); }
.band[data-band="test"] { border-top-color: var(--band-test); }
.band[data-band="release"] { border-top-color: var(--band-release); }
.band.wide { flex: 1 1 0; }
/* width 0, min-width 100%: a band's name never widens its columns. */
.band-name { font-size: 12px; font-weight: 700; color: var(--ink); margin: 0 0 6px; padding-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 0; min-width: 100%; }
.band-cols { display: flex; gap: 6px; flex: 1; }
.col { flex: 1 1 140px; min-width: 140px; background: var(--list); border: 1px solid transparent; border-radius: 10px; padding: 0 8px 8px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 -8px 4px; padding: 8px; display: flex; align-items: center; gap: 6px;
  background: var(--list); border-radius: 10px 10px 0 0; }
/* A column taller than the window scrolls inside itself and keeps its
   header in view (docs/adr/0068 §4): the board scrolls sideways, so a
   header cannot stick to the page. From the 720 px breakpoint up only. */
@media (min-width: 721px) {
  .col:not(.empty):not(.collapsed) { max-height: calc(100vh - 24px); overflow-y: auto; }
  .col h3 { position: sticky; top: 0; z-index: 1; }
}
.col.collapsed, .col.empty { flex: 0 0 40px; min-width: 40px; padding: 8px 4px; }
.col.collapsed h3, .col.empty h3 { margin: 0; padding: 0; writing-mode: vertical-rl; position: static; }
.col.collapsed .col-toggle { writing-mode: horizontal-tb; }
.col.empty .col-toggle { display: none; }
.now { display: block; margin: 4px 0 2px; font-size: 13px; color: var(--muted); }
.now[data-turn="you"] { color: var(--wait); font-weight: 700; }
.now[data-turn="stopped"] { color: var(--nogo); }
.now a.act { font-weight: 700; margin-left: 4px; }
.nowbox { border-left: 4px solid var(--line); padding: 6px 0 6px 12px; margin: 0 0 12px; }
.nowbox[data-turn="you"] { border-color: var(--wait); }
.nowbox[data-turn="stopped"] { border-color: var(--nogo); }
.nowbox .now { font-size: 15px; margin: 0; }
ol.stages { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 12px; }
ol.stages li { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--none-bg); color: var(--none); }
ol.stages li[data-mark="done"] { background: var(--go-bg); color: var(--go); }
ol.stages li[data-mark="now"] { background: var(--wait-bg); color: var(--wait); outline: 2px solid var(--wait); }
ol.stages li[data-mark="stopped"] { background: var(--nogo-bg); color: var(--nogo); }
ol.stages li[data-mark="skipped"] { background: transparent; border: 1px dashed var(--line); }
tr.band-row th { color: var(--ink); font-size: 13px; text-transform: none; letter-spacing: 0; background: var(--bg); }
td.at { white-space: nowrap; }
.savebar { position: sticky; bottom: 0; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin: 0 0 14px;
  box-shadow: 0 -6px 18px var(--shadow); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.savebar .buttons { margin: 0 0 0 auto; }
.savebar #spec-line { flex: 1 1 320px; }
.yours li { margin: 0 0 6px; }
@media (max-width: 720px) {
  /* Provenance, decision (docs/adr/0063 §1): below 720 px two of the
     golden's bands with cards no longer fit side by side, and one column
     under another reads better than a sideways scroll. */
  nav { flex-wrap: nowrap; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .board, .band-cols { flex-direction: column; }
  .band, .band.wide { flex: none; }
  .col, .col.collapsed, .col.empty { flex: none; min-width: 0; width: auto; }
  .col.collapsed h3, .col.empty h3 { writing-mode: horizontal-tb; }
  #kanban-q, #adr-q { min-width: 0; width: 100%; }
  /* The band bar (docs/adr/0068 §5): one button per band, held at the top. */
  .band-jump { display: flex; position: sticky; top: 0; z-index: 4; gap: 6px; overflow-x: auto; padding: 8px 0; margin: 0 0 8px; background: var(--bg); }
  .band { scroll-margin-top: 56px; }
}
.col-toggle { padding: 0 6px; font-size: 12px; line-height: 18px; border-radius: 4px; font-weight: 700; }
.card { display: block; background: var(--card); border: 0; border-radius: 8px; padding: 8px; margin: 0 0 8px; color: var(--ink); text-decoration: none; font-size: 13px; cursor: pointer;
  box-shadow: 0 1px 1px var(--card-shadow), 0 0 1px var(--card-shadow); transition: transform .12s ease-out, box-shadow .12s ease-out; }
.card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px var(--card-shadow), 0 0 1px var(--card-shadow); }
.card:focus, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card.selected { box-shadow: 0 0 0 2px var(--focus); }
.card.moved { background: var(--moved); }
/* A person's turn reads at a glance: a bar of the waiting hue on the card's edge. */
.card[data-turn="you"] { box-shadow: inset 4px 0 0 var(--wait), 0 1px 1px var(--card-shadow), 0 0 1px var(--card-shadow); padding-left: 12px; }
.card[data-turn="you"]:hover { box-shadow: inset 4px 0 0 var(--wait), 0 4px 10px var(--card-shadow), 0 0 1px var(--card-shadow); }
.card .title { font-weight: 700; display: block; }
.card .now { font-size: 12px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.labels { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
.labels:empty { display: none; }
.label { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 18px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--hue-bg); color: var(--hue-ink); }
.label[data-hue="0"] { --hue-bg: var(--hue0); --hue-ink: var(--hue0-ink); }
.label[data-hue="1"], .label.p-P2 { --hue-bg: var(--hue1); --hue-ink: var(--hue1-ink); }
.label[data-hue="2"], .label.p-P1 { --hue-bg: var(--hue2); --hue-ink: var(--hue2-ink); }
.label[data-hue="3"], .label.p-P0 { --hue-bg: var(--hue3); --hue-ink: var(--hue3-ink); }
.label[data-hue="4"] { --hue-bg: var(--hue4); --hue-ink: var(--hue4-ink); }
.label[data-hue="5"] { --hue-bg: var(--hue5); --hue-ink: var(--hue5-ink); }
.label.p-P3 { --hue-bg: var(--hue5); --hue-ink: var(--hue5-ink); }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.who { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--none-bg); color: var(--muted); flex: none; }
.who[data-actor="you"] { background: var(--wait-bg); color: var(--wait); }
.who[data-actor="stopped"] { background: var(--nogo-bg); color: var(--nogo); }
.who[data-actor="done"] { background: var(--go-bg); color: var(--go); }
.who svg, .age svg { width: 14px; height: 14px; }
.age { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pip { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pip.on { background: var(--muted); }
.badges .chip { margin-left: auto; }
.only-mine { font-size: 14px; padding: 5px 12px; border-radius: 999px; font-weight: 600; }

<script>
"use strict";
let book = null, con = null, lastLine = null, busy = false, windowDays = null, answerLine = null;
let etag = null;

// h(tag, attrs, ...children): every text goes through a text node, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "cls") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
// A ticket's name: the logbook's title already starts with the id when it
// comes from the ticket's first line.
const named = (t) => String(t.title).startsWith(t.id) ? t.title : t.id + " — " + t.title;
const unread = (v) => v && typeof v === "object" && !Array.isArray(v) && v.ok === false;
const shown = (v) => (v === null || v === undefined || v === "") ? "—" : v;
function chip(verdict) {
  const cls = ["GO", "NO-GO", "pending", "needs-human", "stranded"].includes(verdict) ? verdict : "none";
  return h("span", {cls: "chip " + cls}, verdict || "not reached");
}
function err(v) { return h("span", {cls: "unread"}, "could not read: " + v.error); }
function dl(pairs) {
  return h("dl", {}, pairs.filter(Boolean).map(([k, v]) => [h("dt", {}, k), h("dd", {}, v instanceof Node ? v : shown(v))]));
}
function ticketsList() { return Array.isArray(book.tickets) ? book.tickets : []; }
function releasesList() { return Array.isArray(book.releases) ? book.releases : []; }

// --- whose turn it is (docs/adr/0063 §2) ----------------------------------
// One sentence per ticket from its state and the logbook's own fields,
// through the tower's table embedded above: who has the ball and what it
// waits for. A person's turn says so, with the one thing to do. It is a
// reading of the record, never a verdict: the columns stay the logbook's.
const MACHINE = JSON.parse(document.getElementById("tower-machine").textContent);
const BANDS = MACHINE.bands;
const bandOf = (state) => (BANDS.find((b) => b.states.includes(state)) || {band: "other"}).band;
const bandName = (band) => (BANDS.find((b) => b.band === band) || {name: "Other"}).name;
function reworkMax() {
  const t = Array.isArray(book.thresholds) ? book.thresholds.find((x) => x.key === "REWORK_MAX_ATTEMPTS") : null;
  return t && /^[0-9]+$/.test(String(t.value)) ? Number(t.value) : null;
}
function openQuestion(t) {
  const qs = t.questions || [];
  const q = qs[qs.length - 1];
  return t.state === "questions" && q && !q.answer ? q : null;
}
// {turn: you | tower | done | stopped, text, href, act}
function now(t) {
  const out = t.outcome || {};
  const id = t.id, n = t.attempt;
  const history = Array.isArray(t.history) ? t.history : [];
  const last = history[history.length - 1] || {};
  const resume = "./go resume TICKET=" + id;
  // A failed step strands the ticket (ADR 0034): it waits for the tickets
  // holding its files, or for a person to resume it.
  if (out.verdict === "stranded" || t.wait) {
    if (t.wait && t.wait.holders.length) return {turn: "stopped", text: "Waits for " + t.wait.holders.join(", ") + " to release its files, then " + resume};
    return {turn: "you", text: "Your turn: " + (t.wait ? "assign was refused (the base, or a missing perimeter)" : shown(last.step) + " stopped (" + shown(out.line) + ")") + "; resume it with",
      code: resume};

// at a time on the 2 s beat, labelled, with no request until it ends.
function startReplay(tid, draw = true) {
  if (replay && replay.timer) clearInterval(replay.timer);
  const t = ticketsList().find((x) => x.id === tid);
  const total = t && Array.isArray(t.timeline) ? t.timeline.length : 0;
  replay = {ticket: tid, row: 0, total, done: false, timer: null};
  if (draw) render();
  replay.timer = setInterval(() => {
    replay.row += 1;
    if (replay.row >= replay.total) { replay.row = replay.total; replay.done = true; clearInterval(replay.timer); replay.timer = null; }
    if (route().screen === "network") render();
  }, REPLAY_BEAT_MS);
}
const replaying = () => replay !== null && !replay.done;

// --- the request editor (docs/adr/0059 §4) --------------------------------
// The fields live here, not in the DOM, so a redraw keeps them. The check
// is /v1/spec-check: gates/spec.sh itself on the draft, which writes
// nothing; its line is shown as the gate printed it.
const draftFields = {title: "", context: "", criteria: [{given: "", when: "", then: ""}], perimeter: "", feature: "", priority: ""};
let checkTimer = null, checkSeq = 0, lastCheck = null, saveLine = null;
// Provenance, decision: docs/adr/0059 §4, one check per pause, not per key.
const CHECK_DELAY_MS = 300;
function draftBody() {
  return {title: draftFields.title, context: draftFields.context,
    criteria: draftFields.criteria.filter((c) => c.given.trim() || c.when.trim() || c.then.trim()),
    perimeter: draftFields.perimeter.split("\n").map((l) => l.trim()).filter(Boolean),
    feature: draftFields.feature.trim(), priority: draftFields.priority};
}
function scheduleCheck() {

}
async function runCheck() {

    try {
      const r = await fetch("/v1/spec-check", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(draftBody())});
      const body = await r.json().catch(() => ({}));
      result = r.ok ? body : {error: "refused (" + r.status + "): " + (body.error || r.statusText)};
    } catch (e) { result = {error: "the console did not answer: " + e}; }
  }
  if (seq !== checkSeq) return;  // a later keystroke's check is on its way
  lastCheck = result;
  showCheck();
}
function showCheck() {
  const line = document.getElementById("spec-line"), chipEl = document.getElementById("spec-chip"),
    pre = document.getElementById("spec-preview"), save = document.getElementById("save");
  if (!line) return;
  const r = lastCheck;
  line.textContent = r ? (r.line || r.error) : "—";
  const go = !!(r && r.line && r.line.startsWith("GO: spec"));
  chipEl.replaceChildren(r && r.line ? chip(go ? "GO" : "NO-GO") : h("span", {cls: "chip none"}, "no line"));
  pre.textContent = r && r.markdown ? r.markdown : "";
  if (save) save.disabled = !canSave() || !go || busy;
}
function canSave() { return con && con.mode !== "snapshot" && con.auth !== "public"; }
async function pressRequest() {
  busy = true; showCheck();

    const body = await r.json().catch(() => ({}));

  } catch (e) { saveLine = {line: "the console did not answer: " + e}; }

}

    h("div", {cls: "panel editor"},

// --- ADR search (docs/adr/0059 §3) ----------------------------------------
// The ADRs are the logbook's, read from the project map: the page searches
// and links them, it computes no relation of its own.
function adrItems() { return book.adrs && Array.isArray(book.adrs.items) ? book.adrs.items : []; }
function adrSearch(q) {
  const text = q.trim();
  if (!text) return adrItems();
  const num = text.match(/^(?:adr\s*)?0*(\d{1,4})$/i);
  const want = num ? num[1].padStart(4, "0") : null;
  const words = text.toLowerCase().split(/\s+/);
  const hits = [];
  for (const a of adrItems()) {
    const hay = (a.number + " " + a.title + " " + a.status + " " + a.text).toLowerCase();
    const byNumber = a.number === want;
    const byFile = a.files.some((f) => f === text || f.endsWith("/" + text) || (text.includes("/") && f.startsWith(text.replace(/\/$/, "") + "/")));
    const byTitle = words.every((w) => a.title.toLowerCase().includes(w));
    if (byNumber || byFile || words.every((w) => hay.includes(w)))
      hits.push([byNumber ? 0 : byFile ? 1 : byTitle ? 2 : 3, a]);
  }
  return hits.sort((x, y) => x[0] - y[0] || x[1].number.localeCompare(y[1].number)).map(([, a]) => a);
}
function snippet(a, q) {
  const w = q.trim().toLowerCase().split(/\s+/)[0];
  const at = w ? a.text.toLowerCase().indexOf(w) : -1;
  if (at < 0) return null;
  const from = Math.max(0, at - 80);
  return (from ? "…" : "") + a.text.slice(from, at + 120).replace(/\s+/g, " ") + "…";
}
function adrRow(a, q) {
  const tickets = Object.fromEntries(ticketsList().map((t) => [t.id, t]));
  return h("div", {cls: "adr", "data-number": a.number},
    h("div", {}, h("a", {href: "#adr/" + a.number}, h("b", {}, a.title))),
    h("div", {cls: "muted"}, "Status: " + (a.status || "none").slice(0, 160)),
    q ? h("div", {cls: "links"}, snippet(a, q)) : null,
    h("div", {cls: "links"}, "Files: ", a.files.length ? a.files.slice(0, 12).map((f) => h("code", {}, f)) : "none",
      a.files.length > 12 ? " and " + (a.files.length - 12) + " more" : ""),
    h("div", {cls: "links"}, "Tickets: ", a.tickets.length ? a.tickets.map((id) => [tickets[id] ? h("a", {href: "#ticket/" + id}, id) : id, " "]) : "none",
      " · ADRs: ", a.adrs.length ? a.adrs.map((n) => [h("a", {href: "#adr/" + n}, n), " "]) : "none"));
}
function drawAdrs() {
  const area = document.getElementById("adr-results");
  if (!area) return;
  const q = route().query.q || "";
  const found = adrSearch(q);
  area.replaceChildren(h("p", {cls: "muted"}, found.length + " of " + adrItems().length + " ADRs"), ...found.map((a) => adrRow(a, q)));
}
function screenAdrs() {
  const out = [h("h1", {}, "ADRs"),
    h("p", {cls: "lede"}, "The project's decisions, from the project map (./go map): search by number, a word of the title, the status, the text, or a file one cites.")];
  if (unread(book.adrs)) return out.concat(h("div", {cls: "panel"}, err(book.adrs)));
  if (!book.adrs) return out.concat(h("div", {cls: "panel"}, h("p", {cls: "muted"}, "This logbook has no adrs (written before 1.2).")));
  const q = route().query.q || "";
  out.push(h("div", {cls: "controls"},
    h("input", {type: "search", id: "adr-q", value: q, placeholder: "0055, kanban, proposed, core/spec.py", "aria-label": "Search the ADRs",
      oninput: (e) => { history.replaceState(null, "", viewHash("adrs", {q: e.target.value}, ["q"])); drawAdrs(); }}),
    h("span", {}, "map built at ", h("span", {cls: "mono"}, shown(book.adrs.map_sha).slice(0, 12)))),
    h("div", {cls: "panel", id: "adr-results"}));

}
function screenAdr(n) {
  const a = adrItems().find((x) => x.number === n);
  if (!a) return [h("h1", {}, "ADR " + n), h("div", {cls: "panel"}, unread(book.adrs) ? err(book.adrs) : "This ADR is not in the project map.")];
  return [h("h1", {}, a.title), h("p", {cls: "lede"}, h("a", {href: "#adrs"}, "← every ADR"), " · ", h("code", {}, a.path)),
    h("div", {cls: "panel"}, adrRow(a, "")), h("div", {cls: "panel"}, h("pre", {}, a.text))];
}

// --- frame -------------------------------------------------------------
// The theme switch (docs/adr/0059 §2): tokens on <html data-theme>, kept in
// the browser when it lets us; no screen reads it.
const themeSelect = document.getElementById("theme");
function storedTheme() {
  try { return localStorage.getItem("lights-out.theme") || "system"; } catch (e) { return document.documentElement.dataset.theme || "system"; }
}
themeSelect.value = ["light", "dark"].includes(storedTheme()) ? storedTheme() : "system";
themeSelect.addEventListener("change", () => {
  const t = themeSelect.value;
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("lights-out.theme", t); } catch (e) { /* storage refused: this page keeps it until it closes */ }
});

function header() {
  const src = book.source || {};
  document.getElementById("who").textContent = [src.workload || "?", "level " + (src.level || "?"),
    con.mode === "snapshot" ? "snapshot of " + (src.commit || "?").slice(0, 12) + ", no plane behind it" : "live",
    con.identity ? "as " + con.identity : null].filter(Boolean).join(" · ");
  document.getElementById("fresh").textContent = con.mode === "live" ? "read at " + (con.read_at || "—") : "";
}
// Which element had the focus, and where its caret was, so a redraw can
// give them back.
function focusMark() {
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  const all = el.name ? [...document.querySelectorAll('[name="' + CSS.escape(el.name) + '"]')] : [];
  return {id: el.id, name: el.name, index: all.indexOf(el), card: el.classList.contains("card") ? el.dataset.id : null,
    start: el.selectionStart, end: el.selectionEnd};
}
function refocus(m) {
  if (!m) return;
  let el = m.card ? document.querySelector('.card[data-id="' + CSS.escape(m.card) + '"]')
    : m.id ? document.getElementById(m.id)
    : m.name ? document.querySelectorAll('[name="' + CSS.escape(m.name) + '"]')[m.index] : null;
  if (!el) return;
  el.focus();
  try { if (m.start !== null && m.start !== undefined) el.setSelectionRange(m.start, m.end); } catch (e) { /* not a text field */ }
}
function render() {
  const main = document.getElementById("main");
  if (!book || !con) return;
  header();
  const {screen, arg} = route();
  for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.s === screen ||
    ((screen === "ticket" || screen === "intake") && a.dataset.s === "kanban") || (screen === "adr" && a.dataset.s === "adrs"));
  let body;
  if (screen === "ticket") body = screenTicket(arg);
  else if (screen === "intake") body = screenIntake(arg);
  else if (screen === "incidents") body = screenIncidents();
  else if (screen === "launch") body = screenLaunch();
  else if (screen === "thresholds") body = screenThresholds();
  else if (screen === "overview") body = screenOverview();
  else if (screen === "kanban") body = screenKanban();
  else if (screen === "network") body = screenNetwork(arg);
  else if (screen === "specs") body = screenSpecs();
  else if (screen === "request") body = screenRequest();
  else if (screen === "adrs") body = screenAdrs();
  else if (screen === "adr") body = screenAdr(arg);
  else body = screenTickets();
  const banners = [];
  if (con.read_error) banners.push(h("div", {cls: "banner err"}, "Stale: the last read failed (" + con.read_error + "); showing the last good logbook."));
  const mark = focusMark();
  main.classList.toggle("wide", screen === "kanban" || screen === "network");
  if (screen !== "kanban") showBack(null);
  main.replaceChildren(...banners, ...body.filter(Boolean));
  if (screen === "kanban") drawBoard();
  if (screen === "adrs") drawAdrs();
  if (screen === "request") { showCheck(); if (!lastCheck && draftFields.title) scheduleCheck(); }
  refocus(mark);
}
// The logbook is fetched with its ETag: an unchanged one costs no body and
// no redraw (docs/adr/0059 §1). The editor is redrawn only by its own
// inputs, so a refresh never takes a keystroke.
async function load() {
  let changed = false;
  try {
    const [c, r] = await Promise.all([fetch("/v1/console.json").then((x) => x.json()),
      fetch("/v1/logbook.json", {headers: etag ? {"If-None-Match": etag} : {}})]);
    con = c;
    if (r.status === 200) {
      const b = await r.json();
      etag = r.headers.get("ETag");
      if (book) { noteMoves(book, b); noteNet(b); }
      book = b; changed = true;
    }
  } catch (e) { /* keep what is shown; the header says when it was read */ }
  if (!book) {
    document.getElementById("main").textContent = "No logbook yet" + (con && con.read_error ? ": " + con.read_error : "; the first read is still running.");
    return false;
  }
  return changed;
}
async function tick() {
  const changed = await load();
  if (!book || busy) return;
  // The editor and an intake's open decisions keep their inputs (docs/adr/0090 §8).
  const editing = route().screen === "request" || (route().screen === "intake" && intakeEdits[route().arg]);
  if (changed && !editing) render(); else header();
}
window.addEventListener("hashchange", () => { render(); });
load().then(() => render());
// A replay holds the poll: it sends no request until it ends (docs/adr/0071 §3).
setInterval(() => { if (con && con.mode === "live" && !replaying()) tick(); }, 2000);
