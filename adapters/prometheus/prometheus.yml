# 5s scrapes so a rate() window of a few tens of seconds holds several
# samples inside the demo's verify window (docs/adr/0012 §8: a decision).
# One job, two targets from M3 (docs/adr/0013 §1): stable and canary are
# the same service at two revisions, which is what Managed Prometheus sees
# on Cloud Run; verify/slo.promql tells them apart by `service_version`
# through the `target_info` join, not by `job`. backend-canary answers only
# once the release controller starts it (compose profile "canary"); until
# then this target is simply down, which adapters/prometheus/ready.sh
# already tolerates (it matches on any target reporting `up == 1`).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000", "backend-canary:8000"]

  # The local Kubernetes cluster's two revisions (docs/adr/0051 §4): the
  # stable and canary Services the argo-rollouts adapter drives, scraped
  # through the k8s plane service's Traefik, which sends each scrape to
  # the Service's current pod; a NodePort scrape keeps one keep-alive
  # connection on the pod it first reached and missed the canary. Two
  # jobs, because both targets are k8s:80 and target_info joins on job
  # and instance. Down, like backend-canary above, unless
  # `./go argo-conformance` has the cluster up.
  - job_name: backend-k8s-stable
    metrics_path: /lights-out/stable/metrics
    static_configs:
      - targets: ["k8s:80"]
  - job_name: backend-k8s-canary
    metrics_path: /lights-out/canary/metrics
    static_configs:
      - targets: ["k8s:80"]
