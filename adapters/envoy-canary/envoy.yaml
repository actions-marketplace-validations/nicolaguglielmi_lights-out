# The L0 canary edge (docs/adr/0012 §4, amended by docs/adr/0013 §3). One
# listener, one route, two weighted clusters. Weights read from the admin
# runtime layer first (runtime_key_prefix "weights"), the values below only
# as the default when no admin override exists yet — so a fresh plane still
# starts 100/0. adapters/envoy-canary/{shift,rollback}.sh move traffic
# through POST /runtime_modify; file-based xDS is rejected (no inotify on
# podman machine's virtiofs, docs/adr/0012 context).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
layered_runtime:
  layers:
    - name: static_layer
      static_layer: {}
    - name: admin_layer
      admin_layer: {}
static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: app
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            weighted_clusters:
                              runtime_key_prefix: weights
                              clusters:
                                - name: stable
                                  weight: 100
                                - name: canary
                                  weight: 0
    # The canary alone (docs/adr/0072 §3): what canary-url.sh names, so the
    # passive DAST scan at staging reaches the canary revision and nothing
    # else. 503 while no canary runs.
    - name: canary-only
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: canary_only
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: canary-only
                  virtual_hosts:
                    - name: canary-only
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: canary }
  clusters:
    - name: stable
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: stable
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: backend, port_value: 8000 }
    # STRICT_DNS against a service that only exists in compose profile
    # "canary" (docs/adr/0013 §1): between `./go up` and the first deploy,
    # and after every rollback, DNS resolution fails every ~5s and Envoy
    # logs it; the cluster has no endpoints until backend-canary resolves,
    # which is correct — weight and endpoints are independent knobs here.
    - name: canary
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: canary
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: backend-canary, port_value: 8000 }
