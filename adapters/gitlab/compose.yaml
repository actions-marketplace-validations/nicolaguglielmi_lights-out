#
# The GitLab CE instance the gitlab adapter is proved on (docs/adr/0058 §8):
# its own compose project, lights-out-gitlab, beside the plane and never part
# of it, started and removed by adapters/gitlab/instance.sh for
# `./go gitlab-conformance`. 19.5.5-ce.0 was the newest CE on 2026-11-12,
# amd64 and arm64, pinned by digest as docs/adr/0051 §4 pins k3s. The
# settings below are what made it fit: 224 s to serve and 2.4 GB resident,
# measured 2026-11-13 on a 4.5 GiB podman VM. The root password and the
# token instance.sh seeds are published constants (adapters/gitlab/env.sh).
name: lights-out-gitlab
services:
  gitlab:
    image: docker.io/gitlab/gitlab-ce:19.5.5-ce.0@sha256:392e6bd5bf118ae520e4038261a5ae39aea05de0d2299a162b4c822a9684cf9b
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: lights-out-local-not-a-secret
      GITLAB_OMNIBUS_CONFIG: >-
        external_url 'http://localhost:${GITLAB_PORT:-8929}';
        puma['worker_processes'] = 0;
        sidekiq['concurrency'] = 5;
        prometheus_monitoring['enable'] = false;
        registry['enable'] = false;
        gitlab_kas['enable'] = false;
        gitlab_rails['usage_ping_enabled'] = false;
    ports:
      - "${GITLAB_PORT:-8929}:${GITLAB_PORT:-8929}"
