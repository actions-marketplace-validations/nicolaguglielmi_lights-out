# SPDX-License-Identifier: Apache-2.0
#
# One root compose file for the whole plane (docs/adr/0010). At M1 it is
# just the app; M2 adds the rest of the L0 services here, not in a second
# file.
name: lights-out

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: meetups
      POSTGRES_USER: meetups
      POSTGRES_PASSWORD: meetups
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    command: ["python", "-m", "meetups.migrate"]
    restart: "no"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups

  geocoder:
    build:
      context: ./app
      dockerfile: fakes/geocoder/Containerfile

  backend:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    ports:
      - "8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      geocoder:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups
      GEOCODER_URL: http://geocoder:8001
      FLAGD_RESOLVER: file
      FLAGD_OFFLINE_FLAG_SOURCE_PATH: /app/flags/flags.json
      APP_VERSION: 0.1.0-m1

  backend-test:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: test
    profiles: ["test"]
    depends_on:
      - postgres
    environment:
      POSTGRES_MAINTENANCE_URL: postgresql://meetups:meetups@postgres:5432/postgres
      TEST_DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups_test

volumes:
  postgres-data:
