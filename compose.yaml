# SPDX-License-Identifier: Apache-2.0
#
# One root compose file for the whole L0 plane (docs/adr/0010, 0012): the
# app (postgres, migrate, geocoder, backend) and, from M2, the plane around
# it. Vendor config lives in adapters/<name>/ and is copied into images at
# build; the only bind mount is app/flags/ into flagd. Run through ./go:
# WORKBENCH_IMAGE is set there and the runner image is built from it.
# From M3 (docs/adr/0013): backend-canary is the same image as backend,
# a second revision the release controller starts on demand (profile
# "canary", not part of `./go up`).
name: lights-out

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: meetups
      POSTGRES_USER: meetups
      POSTGRES_PASSWORD: meetups
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    command: ["python", "-m", "meetups.migrate"]
    restart: "no"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups

  geocoder:
    build:
      context: ./app
      dockerfile: fakes/geocoder/Containerfile

  # image: tags the build so backend-canary (M3) can start a container from
  # exactly this image with no second build (docs/adr/0013 §1: "same image
  # and build as backend").
  backend:
    image: lights-out-backend
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      geocoder:
        condition: service_started
      flagd:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups
      GEOCODER_URL: http://geocoder:8001
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: 0.1.0-m2

  # The canary revision (docs/adr/0013 §1): same image as backend, started
  # only by adapters/envoy-canary/deploy.sh, never by `./go up`. No `build:`
  # section: it reuses the `backend` image tag above, so a deploy never
  # races a build. The `:-` default (not `:?`) keeps `docker-compose config
  # -q` (ci-compose) clean with CANARY_VERSION unset; a drift between what
  # the caller asked for and this default is caught by deploy.sh's own
  # healthz check, not by compose failing to start.
  backend-canary:
    image: lights-out-backend
    profiles: ["canary"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      geocoder:
        condition: service_started
      flagd:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups
      GEOCODER_URL: http://geocoder:8001
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: ${CANARY_VERSION:-0.2.0-waitlist}

  backend-test:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: test
    profiles: ["test"]
    depends_on:
      - postgres
    environment:
      POSTGRES_MAINTENANCE_URL: postgresql://meetups:meetups@postgres:5432/postgres
      TEST_DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups_test

  # The gemini-cli AgentHarness worker (docs/adr/0017 §3): workbench plus
  # @google/gemini-cli, pinned by adapters/gemini-cli/package-lock.json. No
  # engine socket. Reaches the plane's Postgres to run the app's own tests
  # (docs/adr/0017 §10), at the same meetups_test database ./go test uses —
  # safe because demo-crew and record run one worker at a time. user:
  # CREW_UID:CREW_GID (the Makefile's `id -u`/`id -g`) keeps files the
  # model's git writes in the bind-mounted workspace writable by workbench
  # afterwards; HOME is set because that uid has no passwd entry. The `:-`
  # default on GEMINI_API_KEY keeps `docker-compose config -q` (ci-compose)
  # clean with no key set — the adapter itself refuses an empty or
  # placeholder key, loudly, before this service ever starts.
  gemini-cli:
    build:
      context: ./adapters/gemini-cli
      dockerfile: Containerfile
      args:
        WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
    profiles: ["crew"]
    user: "${CREW_UID:-0}:${CREW_GID:-0}"
    depends_on:
      - postgres
    volumes:
      - ./.crew:/crew
      - ./roles:/roles:ro
    security_opt:
      - label=disable
    environment:
      HOME: /tmp/crew-home
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GIT_AUTHOR_NAME: lights-out-crew
      GIT_AUTHOR_EMAIL: crew@lights-out.invalid
      GIT_COMMITTER_NAME: lights-out-crew
      GIT_COMMITTER_EMAIL: crew@lights-out.invalid
      UV_PROJECT_ENVIRONMENT: /tmp/crew-venv
      UV_CACHE_DIR: /crew/.uv-cache
      UV_LINK_MODE: copy
      POSTGRES_MAINTENANCE_URL: postgresql://meetups:meetups@postgres:5432/postgres
      TEST_DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups_test
      # As the backend test image sets it (app/backend/Containerfile); the
      # metrics test needs it and the worker cannot know that.
      OTEL_SEMCONV_STABILITY_OPT_IN: http

  # --- the plane (M2) ---

  # The edge: the only way into the app. stable=100, canary=0 by default,
  # moved through the admin API by adapters/envoy-canary/shift.sh (M3,
  # docs/adr/0013 §3). user: the image entrypoint, as root, chowns
  # /dev/stdout to `envoy` and dies with set -e when rootless podman
  # refuses; started as envoy it just execs. 9901 (admin) is unauthenticated
  # like every other L0 port; the trusted-network line in the README covers it.
  envoy:
    build:
      context: ./adapters/envoy-canary
      dockerfile: Containerfile
    user: envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    depends_on:
      - backend

  prometheus:
    build:
      context: ./adapters/prometheus
      dockerfile: Containerfile
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # The flag file is the one bind mount in the plane; flagd polls it, so a
  # host-side edit is live within seconds (M3's kill switch). label=disable
  # keeps SELinux hosts working without :z, which fails on podman machine.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.3@sha256:a11ae82ec6e40e89edae4327392a1e4ffc03e211f1b724879bb35b2e4f271bb3
    command: ["start", "--uri", "file:/flags/flags.json"]
    volumes:
      - ./app/flags:/flags:ro
    security_opt:
      - label=disable
    ports:
      - "8016:8016"

  # The image ships /etc/zot/config.json (port 5000, /var/lib/registry).
  # Published on 5050: 5000 is macOS AirPlay Receiver.
  zot:
    image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
    ports:
      - "5050:5000"

  # Gitea, rootless image, sqlite, installer skipped. The runner token is
  # fixed and public: at L0 Gitea has no users and no data worth protecting;
  # the README names the LAN risk.
  gitea:
    image: docker.gitea.com/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__actions__ENABLED: "true"
      GITEA_RUNNER_REGISTRATION_TOKEN: lights-out-local-runner-token-not-a-secret-0000
    ports:
      - "3000:3000"

  # Host-mode runner built from the workbench image (docs/adr/0012 §3).
  # Registers against gitea with the fixed token; restarts while gitea boots.
  runner:
    build:
      context: ./adapters/gitea/runner
      dockerfile: Containerfile
      args:
        WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
    restart: on-failure
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_NAME: lights-out-l0
      GITEA_RUNNER_REGISTRATION_TOKEN: lights-out-local-runner-token-not-a-secret-0000

  # Both emulators come from the one official image (447 MB amd64, 356 MB
  # arm64 compressed, measured 2026-09-14): one pull, two containers.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=lights-out"]
    ports:
      - "8085:8085"

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8086", "--project=lights-out"]
    ports:
      - "8086:8086"

volumes:
  postgres-data:
