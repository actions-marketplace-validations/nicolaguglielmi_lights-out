# SPDX-License-Identifier: Apache-2.0
#
# The plane (docs/adr/0010, 0012): everything the platform runs regardless
# of which workload is selected. The workload's own services (docs/adr/
# 0030) live in its contract's compose.yaml, merged in by the Makefile
# (COMPOSE_FILE=compose.yaml:$(WORKLOAD_CONTRACT)/compose.yaml, docs/adr/
# 0036 §2) — this file never names one. Vendor config lives in adapters/<name>/ and is copied into
# images at build; the only bind mount is the workload's flags/ directory
# into flagd. Run through ./go: WORKBENCH_IMAGE is set there and the
# runner image is built from it.
name: lights-out

services:
  # The gemini-cli AgentHarness worker (docs/adr/0017 §3): workbench plus
  # @google/gemini-cli, pinned by adapters/gemini-cli/package-lock.json. No
  # engine socket. Reaches its workload's Postgres to run the workload's
  # own tests (docs/adr/0017 §10; the `depends_on`/`environment` that make
  # that possible live in the workload's own compose fragment, merged in —
  # docs/adr/0030 §3) — safe because demo-crew and record run one worker
  # at a time. user: CREW_UID:CREW_GID (the Makefile's `id -u`/`id -g`)
  # keeps files the model's git writes in the bind-mounted workspace
  # writable by workbench afterwards; HOME is set because that uid has no
  # passwd entry. The `:-` default on GEMINI_API_KEY keeps
  # `docker-compose config -q` (ci-workloads) clean with no key set — the
  # adapter itself refuses an empty or placeholder key, loudly, before
  # this service ever starts.
  gemini-cli:
    build:
      context: ./adapters/gemini-cli
      dockerfile: Containerfile
      args:
        WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
    profiles: ["crew"]
    user: "${CREW_UID:-0}:${CREW_GID:-0}"
    volumes:
      - ./.crew:/crew
      - ./roles:/roles:ro
    security_opt:
      - label=disable
    environment:
      HOME: /tmp/crew-home
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GIT_AUTHOR_NAME: lights-out-crew
      GIT_AUTHOR_EMAIL: crew@lights-out.invalid
      GIT_COMMITTER_NAME: lights-out-crew
      GIT_COMMITTER_EMAIL: crew@lights-out.invalid
      UV_PROJECT_ENVIRONMENT: /tmp/crew-venv
      UV_CACHE_DIR: /crew/.uv-cache
      UV_LINK_MODE: copy

  # --- the plane (M2) ---

  # The edge: the only way into the app. stable=100, canary=0 by default,
  # moved through the admin API by adapters/envoy-canary/shift.sh (M3,
  # docs/adr/0013 §3). user: the image entrypoint, as root, chowns
  # /dev/stdout to `envoy` and dies with set -e when rootless podman
  # refuses; started as envoy it just execs. 9901 (admin) is unauthenticated
  # like every other L0 port; the trusted-network line in the README covers it.
  envoy:
    build:
      context: ./adapters/envoy-canary
      dockerfile: Containerfile
    user: envoy
    # Host side: APP_PORT (Makefile, .env), 8080 unless set.
    ports:
      - "${APP_PORT:-8080}:8080"
      - "9901:9901"
    depends_on:
      - backend

  prometheus:
    build:
      context: ./adapters/prometheus
      dockerfile: Containerfile
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # The flag file is the one bind mount in the plane; flagd polls it, so a
  # host-side edit is live within seconds (M3's kill switch). label=disable
  # keeps SELinux hosts working without :z, which fails on podman machine.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.3@sha256:a11ae82ec6e40e89edae4327392a1e4ffc03e211f1b724879bb35b2e4f271bb3
    command: ["start", "--uri", "file:/flags/flags.json"]
    volumes:
      - ./${WORKLOAD_CONTRACT:?set by the Makefile}/flags:/flags:ro
    security_opt:
      - label=disable
    ports:
      - "8016:8016"

  # The image ships /etc/zot/config.json (port 5000, /var/lib/registry).
  # Published on 5050: 5000 is macOS AirPlay Receiver.
  zot:
    image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
    ports:
      - "5050:5000"

  # Gitea, rootless image, sqlite, installer skipped. The runner token is
  # fixed and public: at L0 Gitea has no users and no data worth protecting;
  # the README names the LAN risk.
  gitea:
    image: docker.gitea.com/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__actions__ENABLED: "true"
      GITEA_RUNNER_REGISTRATION_TOKEN: lights-out-local-runner-token-not-a-secret-0000
    ports:
      - "3000:3000"

  # Host-mode runner built from the workbench image (docs/adr/0012 §3).
  # Registers against gitea with the fixed token; restarts while gitea boots.
  # The engine socket (docs/adr/0015 §7, 0025 §4): the runner is the only
  # compose service with it, jobs run only on refs the workbench user
  # pushed (no fork PRs, no external webhook — this Gitea has neither),
  # and the README's L0 trusted-network line names it. HOST_DOCKER_SOCK is
  # the same path ./go resolves for its own socket mount into workbench;
  # its `:-` default only keeps `docker-compose config -q` (ci-workloads)
  # clean when no target grants it — never used to start the service for
  # real, exactly like the workload's own canary service's image default.
  runner:
    build:
      context: ./adapters/gitea/runner
      dockerfile: Containerfile
      args:
        WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
    restart: on-failure
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_NAME: lights-out-l0
      GITEA_RUNNER_REGISTRATION_TOKEN: lights-out-local-runner-token-not-a-secret-0000
      DOCKER_HOST: unix:///var/run/docker.sock
      # `./go` sets this on workbench's own process (an -e flag on a
      # per-invocation container), which is why every other docker-compose
      # call in this repo has it — the runner is a long-lived service, not
      # a fresh ./go invocation, so a job step's own `docker-compose push`
      # (inside publish.sh) never would otherwise: docker-compose
      # interpolates the whole file, gemini-cli's and this service's own
      # build.args included, both `:?`-required. Baked in at container
      # create time from workbench's own value, same as the image tag.
      WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
      # A job's own workdir is a fresh git clone (act_runner's host mode,
      # not this compose mount) — it never sees the cosign key ./go up
      # generated at $here/.crew/cosign.key on the workbench side.
      # COSIGN_KEY overrides publish.sh's relative default to the one
      # mounted below, read-only: the job signs with the same key
      # core/launchpad.sh already has the public half of (docs/adr/0025 §2).
      COSIGN_KEY: /crew/cosign.key
    # A job reaches Gitea, Zot and the app at host.containers.internal, the
    # name the signature's reference carries. podman provides it in every
    # container; docker only when asked, as ./go asks for workbench. Same
    # address under podman (192.168.127.254 on podman machine, checked
    # 2026-11-02), so this only changes docker.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - ${HOST_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.crew:/crew:ro
    security_opt:
      - label=disable

  # Both emulators come from the one official image (447 MB amd64, 356 MB
  # arm64 compressed, measured 2026-09-14): one pull, two containers.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=lights-out"]
    ports:
      - "8085:8085"

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8086", "--project=lights-out"]
    ports:
      - "8086:8086"
