#
# The plane (docs/adr/0010, 0012): everything the platform runs regardless
# of which workload is selected. The workload's own services (docs/adr/
# 0030) live in its contract's compose.yaml, merged in by the Makefile
# (COMPOSE_FILE=compose.yaml:$(WORKLOAD_CONTRACT)/compose.yaml, docs/adr/
# 0037 §2) — this file never names one. Vendor config lives in adapters/<name>/ and is copied into
# images at build; the only bind mount is the workload's flags/ directory
# into flagd. Run through ./go: WORKBENCH_IMAGE is set there. No service
# holds the engine socket (docs/adr/0060 §5).
name: lights-out

# What every CLI AgentHarness worker shares (docs/adr/0017 §3, 0041 §1,
# §3, §4): the workload's toolchain image (or the workbench, docs/adr/0042
# §8) plus the vendor CLI, pinned by the adapter's package-lock.json or, for a
# release binary, its release.env (docs/adr/0050 §2). No
# engine socket, no git credential. The only mounts are the roles,
# read-only, and what each adapter's run.sh adds with `run -v`: the run's
# own directory under .crew/ and the uv cache, never .crew/ itself (it
# holds the release signing key and every other ticket, docs/adr/0041
# §4). Reaches a Postgres of its own, never the plane's, to run the
# workload's own tests (docs/adr/0017 §10, 0046 §6; the `depends_on`/
# `environment` and that service, on `crew` only, live in the workload's
# own compose fragment, merged in — docs/adr/0030 §3). user: CREW_UID:CREW_GID (the Makefile's `id -u`/`id -g`)
# keeps files the model's git writes in the bind-mounted workspace
# writable by workbench afterwards; HOME is set because that uid has no
# passwd entry. The `:-` default on each key keeps `docker-compose config
# -q` (ci-workloads) clean with no key set — each adapter refuses an
# empty or placeholder key, loudly, before its service ever starts.
# Network (docs/adr/0046 §1, §3): `crew` only, which is internal, so the
# one way out is the `egress` proxy below, through the proxy variables;
# it allows the harness's provider and the hosts the workload's contract
# names, nothing else. No plane service and no plane Postgres is on `crew`.
x-crew-worker: &crew-worker
  profiles: ["crew"]
  user: "${CREW_UID:-0}:${CREW_GID:-0}"
  networks:
    - crew
  # The engine's resolver still answers the names on `crew` (egress, a
  # workload's crew-postgres), but forwards nothing else: its upstream is a
  # documentation address that never answers (docs/adr/0046 §7).
  dns:
    - 192.0.2.1
  volumes:
    - ./roles:/roles:ro
  security_opt:
    - label=disable

x-crew-env: &crew-env
  HOME: /tmp/crew-home
  GIT_AUTHOR_NAME: lights-out-crew
  GIT_AUTHOR_EMAIL: crew@lights-out.invalid
  GIT_COMMITTER_NAME: lights-out-crew
  GIT_COMMITTER_EMAIL: crew@lights-out.invalid
  UV_PROJECT_ENVIRONMENT: /tmp/crew-venv
  UV_CACHE_DIR: /crew/.uv-cache
  UV_LINK_MODE: copy
  HTTPS_PROXY: http://egress:3128
  HTTP_PROXY: http://egress:3128
  https_proxy: http://egress:3128
  http_proxy: http://egress:3128
  NO_PROXY: localhost,127.0.0.1,::1
  no_proxy: localhost,127.0.0.1,::1

x-crew-build-args: &crew-build-args
  WORKBENCH_IMAGE: ${WORKBENCH_IMAGE:?set by ./go}
  # The workload's toolchain image, or the workbench (docs/adr/0042 §8);
  # the Makefile exports it from TOOLCHAIN_IMAGE.
  HARNESS_BASE_IMAGE: ${HARNESS_BASE_IMAGE:?set by the Makefile from TOOLCHAIN_IMAGE}

services:
  # The gemini-cli AgentHarness worker (docs/adr/0017 §3).
  gemini-cli:
    <<: *crew-worker
    build:
      context: ./adapters/gemini-cli
      dockerfile: Containerfile
      args: *crew-build-args
    environment:
      <<: *crew-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # The claude-code AgentHarness worker (docs/adr/0041): Anthropic only.
  claude-code:
    <<: *crew-worker
    build:
      context: ./adapters/claude-code
      dockerfile: Containerfile
      args: *crew-build-args
    environment:
      <<: *crew-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # The codex AgentHarness worker (docs/adr/0041): OpenAI only. The .env
  # name is ADR 0040's OPENAI_API_KEY; codex exec reads CODEX_API_KEY
  # (docs/adr/0041 §2, verified 2026-11-04).
  codex:
    <<: *crew-worker
    build:
      context: ./adapters/codex
      dockerfile: Containerfile
      args: *crew-build-args
    environment:
      <<: *crew-env
      CODEX_API_KEY: ${OPENAI_API_KEY:-}

  # The antigravity-cli AgentHarness worker (docs/adr/0050): Gemini, optional
  # and experimental beside gemini-cli, chosen only by AGENT_HARNESS. Its
  # image holds a proprietary binary downloaded at build (release.env): it
  # is built where it runs and never pushed (docs/adr/0050 §6).
  antigravity-cli:
    <<: *crew-worker
    build:
      context: ./adapters/antigravity-cli
      dockerfile: Containerfile
      args: *crew-build-args
    environment:
      <<: *crew-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # The one way out of `crew` (docs/adr/0046 §2): a forward proxy that
  # opens only the host:port pairs listed in .crew/egress/allow, re-read
  # on every connection. core/egress.sh writes that list from the
  # adapter's EGRESS and the workload's crew-egress.txt and starts this
  # service; no run stops it (parallel network members share it); `./go
  # down` does. On `crew` and `default`, no published port: only the
  # harnesses reach it. Workbench image, core/ read-only, as the
  # conformance stub runs (docs/adr/0041 §8). Port 3128: decision.
  egress:
    image: ${WORKBENCH_IMAGE:?set by ./go}
    profiles: ["crew"]
    user: "${CREW_UID:-0}:${CREW_GID:-0}"
    command: ["python3", "-I", "/core/egress.py", "3128"]
    networks:
      - crew
      - default
    volumes:
      - ./core:/core:ro
      - ./.crew/egress:/work
    security_opt:
      - label=disable
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      EGRESS_DIR: /work

  # --- the plane (M2) ---

  # The edge: the only way into the app. stable=100, canary=0 by default,
  # moved through the admin API by adapters/envoy-canary/shift.sh (M3,
  # docs/adr/0013 §3). user: the image entrypoint, as root, chowns
  # /dev/stdout to `envoy` and dies with set -e when rootless podman
  # refuses; started as envoy it just execs. 9901 (admin) is unauthenticated
  # like every other L0 port; the trusted-network line in the README covers it.
  envoy:
    build:
      context: ./adapters/envoy-canary
      dockerfile: Containerfile
    user: envoy
    # Host side: APP_PORT (Makefile, .env), 8080 unless set.
    ports:
      - "${APP_PORT:-8080}:8080"
      - "9901:9901"
    depends_on:
      - backend

  prometheus:
    build:
      context: ./adapters/prometheus
      dockerfile: Containerfile
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # The flag file is the one bind mount in the plane; flagd polls it, so a
  # host-side edit is live within seconds (M3's kill switch). label=disable
  # keeps SELinux hosts working without :z, which fails on podman machine.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.3@sha256:a11ae82ec6e40e89edae4327392a1e4ffc03e211f1b724879bb35b2e4f271bb3
    command: ["start", "--uri", "file:/flags/flags.json"]
    volumes:
      - ./${WORKLOAD_CONTRACT:?set by the Makefile}/flags:/flags:ro
    security_opt:
      - label=disable
    ports:
      - "8016:8016"

  # The image ships /etc/zot/config.json (port 5000, /var/lib/registry).
  # Published on 5050: 5000 is macOS AirPlay Receiver.
  zot:
    image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
    ports:
      - "5050:5000"

  # ZAP's packaged scans, for the passive baseline at staging (docs/adr/0072
  # §3): verify/dast.sh runs it once per side with `run --rm`, on the
  # plane's network, where canary-url.sh's URL resolves; the report is
  # written to a tmpfs /zap/wrk and printed. Pinned by index digest (amd64
  # and arm64): the 2.17.0 tag moves with every monthly rebuild. Profile
  # dast: never started by `up`, pulled only when DAST=on scans.
  zap:
    image: docker.io/zaproxy/zap-stable:20261103@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    profiles: ["dast"]
    tmpfs:
      - /zap/wrk

  # Gitea, rootless image, sqlite, installer skipped. Actions off: no
  # runner exists at L0, the release step builds the merge itself (docs/adr/
  # 0060 §5). At L0 Gitea has no users and no data worth protecting; the
  # README names the LAN risk.
  gitea:
    image: docker.gitea.com/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__actions__ENABLED: "false"
    ports:
      - "3000:3000"

  # Both emulators come from the one official image (447 MB amd64, 356 MB
  # arm64 compressed, measured 2026-09-14): one pull, two containers. Opt-in
  # (docs/adr/0060 §3): the Makefile starts the `emulators` profile only when
  # EVENT_BUS or STATE_STORE names pubsub-emulator or firestore-emulator; L0
  # and L1 default to spool and sqlite, files under .crew/.
  pubsub-emulator:
    profiles: ["emulators"]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=lights-out"]
    ports:
      - "8085:8085"

  firestore-emulator:
    profiles: ["emulators"]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8086", "--project=lights-out"]
    ports:
      - "8086:8086"

  # The scripted model of gates/harness-conformance.sh (docs/adr/0041 §8):
  # the suite's one far end of the wire. The workbench image runs the stub
  # (Python standard library only); the directory is mounted read-only, and
  # .crew/conformance/model, which the suite creates, is where the stub
  # reads each case's script and writes every request it sees. No key: it
  # checks each request's against CONFORMANCE_CANARY, the random value the
  # suite exports into every key variable (the `:-` default only keeps
  # `docker-compose config -q` clean; the stub exits on an empty one). Only
  # the suite starts it, by name; a CLI harness's container reaches it at
  # http://conformance-model:$CONFORMANCE_PORT on the project's network,
  # through `egress` (docs/adr/0046): the harness is not on `default`.
  # `conformance-sink` is the same container under another name, the host
  # case 9's probe tries to send the key to; nothing may ever reach it.
  conformance-model:
    image: ${WORKBENCH_IMAGE:?set by ./go}
    profiles: ["conformance"]
    networks:
      default:
        aliases:
          - conformance-sink
    user: "${CREW_UID:-0}:${CREW_GID:-0}"
    command: ["python3", "-I", "/stub/stub.py", "${CONFORMANCE_PORT:-8089}"]
    volumes:
      - ./gates/harness-conformance:/stub:ro
      - ./.crew/conformance/model:/work
    security_opt:
      - label=disable
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      STUB_WORK: /work
      CONFORMANCE_CANARY: ${CONFORMANCE_CANARY:-}

# The harnesses' network (docs/adr/0046 §1): internal, so no gateway and no
# route out; `egress` is the one service on it and on `default`, and a
# service a harness depends on (a workload's crew-postgres) is on it alone.
networks:
  crew:
    internal: true
