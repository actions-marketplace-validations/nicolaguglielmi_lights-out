# SPDX-License-Identifier: Apache-2.0
#
# lights-out gates, as a GitHub Action (docs/adr/0045 §5, 0057 §6). At the
# repository root because the Marketplace lists only that file. Runs the
# lights-out wrapper of this same ref on the checked-out repository, so the
# Action's tag and the image's version cannot drift, and posts the one
# GO/NO-GO line as a check run whose summary has one line per gate. Linux
# runners only (it needs docker). The caller grants `contents: read` and
# `checks: write`, and checks out with `fetch-depth: 0`:
#
#   permissions:
#     contents: read
#     checks: write
#   steps:
#     - uses: actions/checkout@v7
#       with:
#         fetch-depth: 0
#     - uses: nicolaguglielmi/lights-out@v0.3.1
#
# `gates: test-proof` or `gates: test-integrity` runs only those gates, as
# the two standalone Actions in actions/ do. Up to v0.2.0 the path was
# nicolaguglielmi/lights-out/action@<tag>; those tags keep it.
#
# On a repository with no committed .lights-out/ contract, at the head or
# the base, the check stays NO-GO (nothing judges without a contract at the
# base, docs/adr/0064): the Action then runs `lights-out init` on the base,
# puts the draft's three small files in the check's summary, uploads the
# whole draft as the artifact lights-out-draft-<job id> and writes the two
# commands that commit it. No permission beyond the two above.
#
# The token is used only after the container has exited, never passed into
# it. On a pull request from a fork the token cannot write checks: the post
# is skipped with a warning, and the job's own status carries the verdict.
name: lights-out gates
description: Judge a pull request with the lights-out gates and post the GO/NO-GO line as a check, one line per gate
author: nicolaguglielmi
branding:
  icon: check-circle
  color: gray-dark

inputs:
  gates:
    description: Which gates. all (default, the eight), test-proof (test, then the changed tests must fail on the base) or test-integrity (test-weakening, then mutation on the changed lines).
    required: false
    default: all
  base:
    description: The base of the range judged. Default the pull request's base, else the parent of the checked-out commit.
    required: false
    default: ""
  head:
    description: The head of the range judged. Default the checked-out commit.
    required: false
    default: ""
  judged:
    description: Commits whose trees were already judged, space-separated. Mutation skips the lines the head shares with any of them (docs/adr/0074). Default none, every changed line.
    required: false
    default: ""
  sha:
    description: The commit the check run is posted on. Default the pull request's head, else github.sha.
    required: false
    default: ""
  path:
    description: The repository's directory, relative to the workspace.
    required: false
    default: "."
  image:
    description: The lights-out image. Default the gates image this ref's wrapper names.
    required: false
    default: ""
  name:
    description: The check run's name. Default "lights-out gates", or "lights-out test-proof" and "lights-out test-integrity".
    required: false
    default: ""
  token:
    description: The token that posts the check run.
    required: false
    default: ${{ github.token }}

outputs:
  line:
    description: The one GO/NO-GO line
    value: ${{ steps.gates.outputs.line }}
  verdict:
    description: GO or NO-GO
    value: ${{ steps.gates.outputs.verdict }}
  check_url:
    description: The check run's URL, when it was posted
    value: ${{ steps.check.outputs.check_url }}

runs:
  using: composite
  steps:
    - id: gates
      shell: sh
      env:
        CONTAINER_ENGINE: docker
        LIGHTS_OUT_IMAGE: ${{ inputs.image }}
        LO_GATES: ${{ inputs.gates }}
        LO_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        LO_HEAD: ${{ inputs.head }}
        LO_JUDGED: ${{ inputs.judged }}
        LO_PATH: ${{ inputs.path }}
        LO_OUT: ${{ runner.temp }}/lights-out
        LO_DRAFT: ${{ runner.temp }}/lights-out-draft
      run: |
        set -u
        [ -n "$LIGHTS_OUT_IMAGE" ] || unset LIGHTS_OUT_IMAGE
        case "$LO_GATES" in
          all|"") cmd=gates ;;
          test-proof|test-integrity) cmd=$LO_GATES ;;
          *) cmd="" ;;
        esac
        cd "$GITHUB_WORKSPACE/$LO_PATH"
        set --
        [ -z "$LO_BASE" ] || set -- "$@" "BASE=$LO_BASE"
        head=${LO_HEAD:-$(git rev-parse HEAD)}
        set -- "$@" "HEAD=$head"
        # Passed only when given: an image older than docs/adr/0074 refuses JUDGED=.
        [ -z "$LO_JUDGED" ] || set -- "$@" "JUDGED=$LO_JUDGED"
        # What this run judged, recorded on the check (docs/adr/0074 §2):
        # full shas, the base as the image picks it (BASE, else HEAD~1).
        range=$(printf '%s..%s' "$(git rev-parse -q --verify "${LO_BASE:-$head~1}^{commit}" 2>/dev/null)" \
          "$(git rev-parse -q --verify "$head^{commit}" 2>/dev/null)")
        case "$range" in ..*|*..) range="" ;; esac
        # The image refuses some ranges before it creates gates/ (the first
        # run among them): the line's own summary still needs a place.
        mkdir -p "$LO_OUT/gates"
        rm -f "$LO_OUT/gates/summary.md"
        if [ -z "$cmd" ]; then
          line="NO-GO: gates — gates: $LO_GATES is not all, test-proof or test-integrity"
        elif [ -n "$LO_BASE" ] && ! git cat-file -e "$LO_BASE^{commit}" 2>/dev/null; then
          line="NO-GO: $cmd — the base $LO_BASE is not in the checkout; check out with fetch-depth: 0"
        else
          line=$(LIGHTS_OUT_OUT="$LO_OUT" sh "$GITHUB_ACTION_PATH/lights-out" "$cmd" "$@") || true
          [ -n "$line" ] || line="NO-GO: $cmd — lights-out gave no verdict; see the log above"
        fi
        case "$line" in GO:*) verdict=GO ;; *) verdict=NO-GO ;; esac
        printf '%s\n' "$line"
        printf 'line=%s\n' "$line" >> "$GITHUB_OUTPUT"
        printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
        printf 'name=lights-out %s\n' "${cmd:-gates}" >> "$GITHUB_OUTPUT"
        printf 'range=%s\n' "$range" >> "$GITHUB_OUTPUT"
        # The summary the image wrote, one line per gate; the line alone otherwise.
        summary="$LO_OUT/gates/summary.md"
        [ -s "$summary" ] || printf '### lights-out %s\n\n`%s`\n' "${cmd:-gates}" "$line" > "$summary.line"
        [ -s "$summary" ] || summary="$summary.line"
        # The first run (docs/adr/0064 §4): no contract at the head or the base.
        # The line, the conclusion and the exit stay; init drafts from the base
        # (else the head judged), for the summary and an artifact.
        if [ "$line" = "NO-GO: $cmd — the repository has no .lights-out/workload.env committed; lights-out init drafts one" ]; then
          from=${LO_BASE:-$head}
          rm -rf "$LO_OUT/.lights-out" "$LO_OUT/init" "$LO_DRAFT"
          init=$(LIGHTS_OUT_OUT="$LO_OUT" sh "$GITHUB_ACTION_PATH/lights-out" init "HEAD=$from") || true
          printf '%s\n' "${init:-NO-GO: init — lights-out init gave no verdict; see the log above}" | tail -n 1 >&2
          if [ -s "$LO_OUT/init/summary.md" ]; then
            { printf '\n'; cat "$LO_OUT/init/summary.md"; } >> "$summary"
          else
            printf '\nlights-out init could not draft a contract from %s; see the log. No draft is offered.\n' "$from" >> "$summary"
          fi
          case "$init" in
            GO:*)
              if [ -f "$LO_OUT/.lights-out/workload.env" ]; then
                mkdir -p "$LO_DRAFT" && cp -R "$LO_OUT/.lights-out" "$LO_DRAFT/.lights-out"
                printf 'draft=%s\n' "$LO_DRAFT" >> "$GITHUB_OUTPUT"
                printf 'artifact=lights-out-draft-%s\n' "$GITHUB_JOB" >> "$GITHUB_OUTPUT"
                printf 'from=%s\n' "$(git rev-parse --short "$from")" >> "$GITHUB_OUTPUT"
              fi ;;
          esac
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"

    # The draft, whole: its runners' lockfiles do not fit a check's summary.
    # Unzipped at the repository's root it is .lights-out/ and nothing else.
    - id: upload
      if: steps.gates.outputs.draft != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.gates.outputs.artifact }}
        path: ${{ steps.gates.outputs.draft }}
        include-hidden-files: true
        overwrite: true
        if-no-files-found: error

    - id: commands
      if: steps.gates.outputs.draft != ''
      shell: sh
      env:
        LO_SUMMARY: ${{ steps.gates.outputs.summary }}
        LO_ARTIFACT: ${{ steps.gates.outputs.artifact }}
        LO_FROM: ${{ steps.gates.outputs.from }}
        LO_URL: ${{ steps.upload.outputs.artifact-url }}
        LO_UPLOADED: ${{ steps.upload.outcome }}
      run: |
        set -u
        # shellcheck disable=SC2016 # the backticks are Markdown, not a command
        if [ "$LO_UPLOADED" = success ]; then
          printf '\n#### The fix is one commit\n\nThe whole draft is the artifact [`%s`](%s) of this run. Review the files above, then at the root of the repository:\n\n```sh\ngh run download %s -R %s -n %s\ngit add .lights-out && git commit -m "lights-out: the contract drafted from %s"\n```\n\nThe next run is judged by that contract.\n' \
            "$LO_ARTIFACT" "$LO_URL" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$LO_ARTIFACT" "$LO_FROM" > "$LO_SUMMARY.commands"
        else
          printf '\nThe draft could not be uploaded as an artifact (see the log); `lights-out init` drafts the same on a machine with podman or docker.\n' > "$LO_SUMMARY.commands"
        fi
        cat "$LO_SUMMARY.commands" >> "$LO_SUMMARY"
        cat "$LO_SUMMARY.commands" >> "$GITHUB_STEP_SUMMARY"

    - id: check
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.token }}
        LO_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
        LO_NAME: ${{ inputs.name || steps.gates.outputs.name }}
        LO_LINE: ${{ steps.gates.outputs.line }}
        LO_VERDICT: ${{ steps.gates.outputs.verdict }}
        LO_SUMMARY: ${{ steps.gates.outputs.summary }}
        LO_RANGE: ${{ steps.gates.outputs.range }}
      run: |
        set -u
        conclusion=failure
        [ "$LO_VERDICT" != GO ] || conclusion=success
        # The checks API takes up to 65535 characters of summary.
        summary=$(head -c 65000 "$LO_SUMMARY" 2>/dev/null) || summary=$LO_LINE
        body=$(jq -n --arg name "$LO_NAME" --arg sha "$LO_SHA" --arg c "$conclusion" --arg line "$LO_LINE" \
          --arg summary "$summary" --arg range "$LO_RANGE" \
          --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          '{name: $name, head_sha: $sha, status: "completed", conclusion: $c,
            details_url: $url, output: {title: ($line | .[0:255]), summary: $summary}}
           + (if $range == "" then {} else {external_id: $range} end)')
        resp=$(mktemp)
        code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs" -d "$body") || code=000
        if [ "$code" = 201 ]; then
          printf '%s: check run posted on %s, %s\n' "$LO_NAME" "$LO_SHA" "$conclusion"
          printf 'check_url=%s\n' "$(jq -r .html_url "$resp")" >> "$GITHUB_OUTPUT"
        else
          printf '::warning title=%s::the check run was not posted (HTTP %s; a fork pull request has a read-only token, or checks: write is missing); the job status carries the verdict\n' "$LO_NAME" "$code"
          cat "$resp" >&2 || true
        fi

    - shell: sh
      env:
        LO_NAME: ${{ inputs.name || steps.gates.outputs.name }}
        LO_LINE: ${{ steps.gates.outputs.line }}
        LO_VERDICT: ${{ steps.gates.outputs.verdict }}
      run: |
        [ "$LO_VERDICT" = GO ] || { printf '::error title=%s::%s\n' "$LO_NAME" "$LO_LINE"; exit 1; }
