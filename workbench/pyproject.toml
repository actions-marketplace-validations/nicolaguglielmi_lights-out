# The workbench's own Python dependencies (docs/adr/0020 §5): the ADK the
# three conversational roles run on and the packages `adk eval` needs for
# trajectory-only criteria. Measured 2026-09-16 on 2.9.1: the eval CLI
# imports `vertexai` unconditionally (evaluation/vertex_ai_eval_facade.py),
# so google-cloud-aiplatform is required even when no LLM-judge criterion
# is configured — 296 MB installed against 658 MB for the full
# `google-adk[eval]` extra (scikit-learn, gepa), which nothing here uses.
# Exact pins; uv.lock is the pin. Installed into /opt/workbench-venv at
# image build; the image tag covers this file and the lock (go). Bump in
# a dedicated commit whose eval is `./go ci`.
[project]
name = "lights-out-workbench"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.9.1",
    "google-cloud-aiplatform==2.1.3",
    "rouge-score==0.1.2",
    "pandas==2.3.3",
    "tabulate==0.9.0",
]

[tool.uv]
package = false
