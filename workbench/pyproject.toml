# The workbench's own Python dependencies (docs/adr/0020 §5): the ADK the
# three conversational roles run on and the packages `adk eval` needs for
# trajectory-only criteria. Measured 2026-09-16 on 2.9.1: the eval CLI
# imports `vertexai` unconditionally (evaluation/vertex_ai_eval_facade.py),
# so google-cloud-aiplatform is required even when no LLM-judge criterion
# is configured — 296 MB installed against 658 MB for the full
# `google-adk[eval]` extra (scikit-learn, gepa), which nothing here uses.
# Exact pins; uv.lock is the pin. Installed into /opt/workbench-venv at
# image build; the image tag covers this file and the lock (go). Bump in
# a dedicated commit whose eval is `./go ci`.
# litellm (docs/adr/0040 §6): the ADK roles reach Claude and OpenAI through
# ADK's LiteLlm wrapper, which imports litellm only on that branch; the
# pin is the newest release on 2026-11-03 and brings openai with it, not
# the anthropic SDK. Measured in a fresh Python 3.13 venv the same day:
# google-adk alone 61 MB of site-packages, with litellm 239 MB (+178 MB,
# 50 transitive packages), paid once per image build, L0 included.
# mcp (2026-11-04, found by the first Claude record-evals on Actions):
# litellm 1.106.6 imports `mcp` on the anthropic path and failed every
# eval case with "No module named 'mcp'" before any model call; 2.3.0 is
# the version litellm's own `proxy` extra resolves to.
# jsonschema (docs/adr/0047 §2): ci/logbook.sh validates the logbook against
# its committed schemas. Already in the lock at this version as a transitive
# dependency of google-adk, pinned directly so a bump of the ADK cannot
# take it away; no new bytes are downloaded.
# google-adk 2.14.0 (2026-11-13): the oldest release whose cap admits
# opentelemetry-api 1.45.2, the fix for GHSA-mf5v-w3w3-f6cg and
# GHSA-xcq7-p3pf-p88h; 2.9.1 to 2.12.0 cap it at 1.42.1, 2.13.0 at 1.44.
# Its `eval` extra now asks google-cloud-aiplatform>=2.2 and `extensions`
# caps litellm<1.106.3; neither extra is installed here, and `./go ci`'s
# evals run on aiplatform 2.1.3 as pinned below.
[project]
name = "lights-out-workbench"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.14.0",
    "litellm==1.106.6",
    "mcp==2.3.0",
    "google-cloud-aiplatform==2.1.3",
    "rouge-score==0.1.2",
    "pandas==2.3.3",
    "tabulate==0.9.0",
    "jsonschema==4.26.0",
]

[tool.uv]
package = false
