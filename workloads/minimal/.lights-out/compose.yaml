#
# This repository's compose services (docs/adr/0030 §3, §6): merged after
# lights-out's root compose.yaml. Paths resolve from the lights-out
# checkout, where this repository is not at a path it can know: its root
# is ${WORKLOAD} (docs/adr/0037 §2). No database, no frontend, no
# gemini-cli fragment (its tests need nothing beyond what the root file
# already gives the worker). The image name stays lights-out-backend, the
# same as every other workload's: one plane runs one workload at a time,
# so one name serves (docs/adr/0030 §3).
services:
  backend:
    image: localhost:5050/lights-out-backend:${APP_TAG:-latest}
    build:
      context: ${WORKLOAD}
      dockerfile: Containerfile
      target: runtime
    # minimal/app.py connects to flagd at import and exits when flagd has
    # not answered within the provider's 500 ms default; restart retries
    # until it does (lights-out ticket 0010 item 7).
    restart: on-failure
    depends_on:
      flagd:
        condition: service_started
    environment:
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: 0.1.0-minimal

  backend-canary:
    image: ${CANARY_IMAGE:-localhost:5050/lights-out-backend:latest}
    profiles: ["canary"]
    restart: on-failure
    depends_on:
      flagd:
        condition: service_started
    environment:
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: ${CANARY_VERSION:-0.2.0-outage}

  backend-test:
    build:
      context: ${WORKLOAD}
      dockerfile: Containerfile
      target: test
    profiles: ["test"]
