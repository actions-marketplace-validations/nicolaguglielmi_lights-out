[project]
name = "minimal"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-prometheus==0.65b0",
  "openfeature-sdk==0.10.0",
  "openfeature-provider-flagd==0.5.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "cosmic-ray==8.7.0",
  "bandit==1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimal"]
