# Working-tree-only allowlist for ci/secrets.sh (docs/adr/0025 Consequences,
# "Amended 2026-09-20, owner ruling"). Not .gitleaks.toml, and not at the
# repo root: gitleaks never auto-loads this file on its own. ci/secrets.sh
# passes it with -c to the `gitleaks dir` (working-tree) scan only; the
# `gitleaks git` (history) scan keeps running with no config at all, so no
# entry here can ever hide anything that was once committed.
#
# The one thing this allowlists is the passwordless local cosign key
# `./go up` generates at .crew/cosign.key (docs/adr/0025 §2): gitignored,
# never staged, never committed — ci/secrets.sh asserts exactly that, for
# this exact path, before either scan runs. Both `paths` and `regexes` must
# match (condition = "AND"): a same-named file holding anything else is
# still a finding, and a file with this content anywhere else is still a
# finding too. The path is anchored to precisely what gitleaks 8.30.1
# reports for a file at .crew/cosign.key when scanning `.` (verified
# against the pinned version 2026-09-20: it reports "path/to/file", not
# "./path/to/file"), so a change to that reporting is a wrong anchor that
# fails closed, not a silent hole.

[extend]
useDefault = true

[[allowlists]]
description = "the local passwordless cosign key ./go up generates at .crew/cosign.key (docs/adr/0025 §2); gitignored, never committed"
condition = "AND"
paths = ['''^\.crew/cosign\.key$''']
regexes = ['''-----BEGIN ENCRYPTED SIGSTORE PRIVATE KEY-----''']
regexTarget = "match"

[[allowlists]]
description = "the Gemini API key line .env.example tells the user to write into their own .env (amended 2026-11-02); scoped like the cosign entry: that path AND that line, and ci/secrets.sh proves .env is gitignored and untracked first"
condition = "AND"
paths = ['''^\.env$''']
regexes = ['''^GEMINI_API_KEY=''', '''^ANTHROPIC_API_KEY=''', '''^OPENAI_API_KEY=''', '''^METRICS_AUTH_HEADER=''', '''^GITHUB_TOKEN=''']
regexTarget = "line"

[[allowlists]]
description = "the clone ./go attach makes of a user's repository (docs/adr/0037 §3); gitignored, never committed, and scanned as that repository by the secrets gate on its own ranges"
paths = ['''^\.attached/''']

[[allowlists]]
description = "the uv and npm caches core/toolchain.sh keeps under .crew/cache/ for the workbench form (docs/adr/0042 §2): third-party sources and tarballs, gitignored, never committed; ci/secrets.sh proves the path ignored and untracked first"
paths = ['''^\.crew/cache/''']

[[allowlists]]
description = "the logbook ./go logbook and ./go dora write at .crew/logbook.json (docs/adr/0047 §2): its threshold rows name a policy key (the row whose key is LATENCY_P95_MAX_DELTA), which generic-api-key reads as a key (entropy 3.65, gitleaks 8.30.1, 2026-11-13). Scoped like the cosign entry (docs/adr/0083, amendment §6): that rule only, that path AND a line that is exactly an upper-snake key row; the same row elsewhere, any other rule and any other value in the file are still findings. ci/secrets.sh proves the path ignored and untracked first"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^\.crew/logbook\.json$''']
regexes = ['''^\s*"key": "[A-Z][A-Z0-9_]*",?$''']
regexTarget = "line"
