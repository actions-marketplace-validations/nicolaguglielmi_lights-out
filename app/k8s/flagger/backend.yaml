# SPDX-License-Identifier: Apache-2.0
#
# This instance on Kubernetes under Flagger (docs/adr/0095 §5): what the
# flagger Delivery adapter is proved against, beside ../backend.yaml, which
# is Argo Rollouts'. adapters/argo-rollouts/cluster.sh applies the files of
# one directory only, so each controller reads its own.
#
# - @STABLE_IMAGE@ is the digest the Registry port verified, as for Argo;
#   @ERROR_RATE_MAX_DELTA@ is policy/merge.env's, the number verify/slo.sh
#   judges with, so Flagger's analysis and ours read one threshold.
# - The version is the pod-template annotation lights-out.dev/version, read
#   into APP_VERSION through the downward API, as for Argo.
# - Flagger copies the Deployment `backend` into `backend-primary` and
#   generates the Services backend, backend-primary and backend-canary and
#   the TraefikService `backend`; the IngressRoutes below point at them.
# - The Flagger controller runs in flagger-system and calls the webhooks
#   and Prometheus itself: their URLs name this namespace, lights-out
#   (FLAGGER_NAMESPACE's default).
# - The analysis (docs/adr/0095 §2, §4): stepWeights are the launchpad's;
#   every increase waits on the loadtester's gate, which only shift.sh
#   opens; the promotion is held at /gate/halt; rollback.sh opens the
#   rollback flag. The metric is the canary's 5xx rate minus the stable's
#   over 1 minute, 0 when there is no traffic: an empty answer is a failed
#   check to Flagger, and a canary waiting at a closed gate with no load is
#   not failing.
# - Prometheus scrapes each revision through Traefik at the paths Argo's
#   manifests use, so adapters/prometheus/prometheus.yml needs no new job.
# - postgres, geocoder, flagd and prometheus have no selector: cluster.sh
#   bridges each to the plane's compose service of the same name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        lights-out.dev/version: 0.1.0-m2
    spec:
      containers:
        - name: backend
          image: "@STABLE_IMAGE@"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['lights-out.dev/version']
            - name: DATABASE_URL
              value: postgresql://meetups:meetups@postgres:5432/meetups
            - name: GEOCODER_URL
              value: http://geocoder:8001
            - name: FLAGD_RESOLVER
              value: in-process
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_SYNC_PORT
              value: "8015"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: error-rate-delta
spec:
  provider:
    type: prometheus
    address: http://prometheus.lights-out:9090
  query: |
    (
      (sum(rate(http_server_request_duration_seconds_count{job="backend-k8s-canary",http_response_status_code=~"5.."}[1m])) or vector(0))
        / (sum(rate(http_server_request_duration_seconds_count{job="backend-k8s-canary"}[1m])) > 0)
      or on() vector(0)
    )
    -
    (
      (sum(rate(http_server_request_duration_seconds_count{job="backend-k8s-stable",http_response_status_code=~"5.."}[1m])) or vector(0))
        / (sum(rate(http_server_request_duration_seconds_count{job="backend-k8s-stable"}[1m])) > 0)
      or on() vector(0)
    )
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: backend
spec:
  provider: traefik
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  service:
    port: 8000
    targetPort: http
  analysis:
    interval: 10s
    threshold: 2
    stepWeights: [5, 25, 100]
    metrics:
      - name: error-rate-delta
        templateRef:
          name: error-rate-delta
        interval: 1m
        thresholdRange:
          max: @ERROR_RATE_MAX_DELTA@
    webhooks:
      - name: lights-out-stage
        type: confirm-traffic-increase
        url: http://flagger-loadtester.lights-out/gate/check
      - name: lights-out-promotion
        type: confirm-promotion
        url: http://flagger-loadtester.lights-out/gate/halt
      - name: lights-out-rollback
        type: rollback
        url: http://flagger-loadtester.lights-out/rollback/check
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: backend
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: revision-metrics
spec:
  stripPrefix:
    prefixes:
      - /lights-out/stable
      - /lights-out/canary
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: revision-metrics
spec:
  entryPoints:
    - web
  routes:
    - match: Path(`/lights-out/stable/metrics`)
      kind: Rule
      middlewares:
        - name: revision-metrics
      services:
        - name: backend-primary
          port: 8000
    - match: Path(`/lights-out/canary/metrics`)
      kind: Rule
      middlewares:
        - name: revision-metrics
      services:
        - name: backend-canary
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: geocoder
spec:
  ports:
    - port: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
spec:
  ports:
    - port: 8015
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  ports:
    - port: 9090
