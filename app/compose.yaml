#
# This instance's compose services (docs/adr/0030 §3): merged after the
# root compose.yaml (COMPOSE_FILE=compose.yaml:$(WORKLOAD)/compose.yaml,
# set by the Makefile from WORKLOAD). Relative paths below resolve from
# the repo root, the same project directory the root file uses — not from
# this file's own location (docs.docker.com, verified 2026-09-23) — so
# `build.context` here is unchanged from before the Workload port existed.
# No `name:` (the last file to set one wins; only the root file sets it).
#
# backend/backend-canary/backend-test are the three services the port
# fixes (docs/adr/0030 §3); postgres/migrate/geocoder are this instance's
# own. The crew-worker fragment at the bottom has no `build:` (that stays
# in the root file, workload-agnostic): compose merges its `depends_on`
# and `environment` into the root file's harness services, which is how
# the worker reaches this instance's Postgres to run its tests without
# the root file ever naming it. It is declared once and applied to every
# CLI harness's service (docs/adr/0041 §11; ci/harness-shape.sh checks it).
#
# The worker's Postgres is its own, crew-postgres, never the plane's
# (docs/adr/0046 §6): the plane's runs the live app as superuser and sits
# on `default`, where `COPY ... TO PROGRAM` would give an injected test a
# shell with a route out. crew-postgres is on the internal `crew` network
# only, ephemeral, started by a harness run and by nothing else.
x-crew-worker: &crew-worker
  depends_on:
    - crew-postgres
  environment:
    POSTGRES_MAINTENANCE_URL: postgresql://meetups:meetups@crew-postgres:5432/postgres
    TEST_DATABASE_URL: postgresql://meetups:meetups@crew-postgres:5432/meetups_test
    OTEL_SEMCONV_STABILITY_OPT_IN: http

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: meetups
      POSTGRES_USER: meetups
      POSTGRES_PASSWORD: meetups
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Readiness, not start: backend-test waits on it. Without it a cold
    # runner started the suite before Postgres answered and all 29 tests
    # errored at setup in 0.8 s (record run on Actions, 2026-11-04). 2 s x 30
    # is a decision: a minute is longer than any start measured here.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meetups", "-d", "meetups"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The worker's own Postgres (docs/adr/0046 §6): the plane's pinned image,
  # no named volume, on `crew` only, so nothing on it has a route out and
  # the worker never touches the live app's data.
  crew-postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["crew"]
    networks:
      - crew
    environment:
      POSTGRES_DB: meetups
      POSTGRES_USER: meetups
      POSTGRES_PASSWORD: meetups

  migrate:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    command: ["python", "-m", "meetups.migrate"]
    restart: "no"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups

  geocoder:
    build:
      context: ./app
      dockerfile: fakes/geocoder/Containerfile

  # image: tags the build so backend-canary (M3) can start a container from
  # exactly this image with no second build (docs/adr/0013 §1: "same image
  # and build as backend").
  # image: registry-qualified and APP_TAG-driven (docs/adr/0025 §1, §3):
  # `./go up` builds and tags it at the current checkout's sha, then
  # publish.sh pushes and signs that exact tag — no retag, no rebuild.
  # localhost:5050 is the one registry host both engines treat as
  # insecure without configuration.
  #
  # restart: on-failure (ticket 0010 item 7): the app connects to flagd at
  # import (meetups/flags.py, set_provider_and_wait) and exits with
  # ProviderNotReadyError when flagd's sync has not answered within the
  # provider's 500 ms default (openfeature-provider-flagd 0.5.2,
  # DEFAULT_DEADLINE). On loaded GitHub runners it did not answer in time,
  # the process died, and Envoy, started fine, had no upstream for 180 s
  # (runs 41710407450 and 41821734075, launch job). A restart retries
  # until flagd answers; a backend broken for good still fails ready.sh.
  backend:
    image: localhost:5050/lights-out-backend:${APP_TAG:-latest}
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: runtime
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      geocoder:
        condition: service_started
      flagd:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups
      GEOCODER_URL: http://geocoder:8001
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: 0.1.0-m2

  # The canary revision (docs/adr/0013 §1): started only by
  # adapters/envoy-canary/deploy.sh, never by `./go up`, at the specific
  # verified digest core/launchpad.sh resolved (docs/adr/0025 §6) — no
  # `build:` section, so a deploy never races a build. The Makefile
  # defaults CANARY_IMAGE to the same tag `backend` above resolves to, so
  # `docker-compose config -q` (ci-workloads) stays clean with no release
  # in flight; deploy.sh always overrides it for a real deploy.
  backend-canary:
    image: ${CANARY_IMAGE:-localhost:5050/lights-out-backend:latest}
    profiles: ["canary"]
    # The same import-time flagd connection as backend, above.
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      geocoder:
        condition: service_started
      flagd:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups
      GEOCODER_URL: http://geocoder:8001
      FLAGD_RESOLVER: in-process
      FLAGD_HOST: flagd
      FLAGD_SYNC_PORT: "8015"
      APP_VERSION: ${CANARY_VERSION:-0.2.0-waitlist}

  backend-test:
    build:
      context: ./app
      dockerfile: backend/Containerfile
      target: test
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_MAINTENANCE_URL: postgresql://meetups:meetups@postgres:5432/postgres
      TEST_DATABASE_URL: postgresql://meetups:meetups@postgres:5432/meetups_test

  # Extend the root file's harness services (no build/profiles/volumes of
  # their own): crew-postgres and the test-database URL
  # its test suite needs (docs/adr/0017 §10), plus the env var its metrics
  # test needs (app/backend/Containerfile sets it on the shipped image; the
  # worker cannot know that on its own).
  gemini-cli: *crew-worker
  claude-code: *crew-worker
  codex: *crew-worker

volumes:
  postgres-data:
