# lights-out judges its own changes with its own gates (docs/adr/0049):
# the Action at the root (docs/adr/0057 §6), on this repository, with the contract committed
# in .lights-out/. Every push judges its commit against its last green
# first-parent ancestor (docs/adr/0074); a pull
# request, GitHub's merge commit against its first parent, the PR's base.
# The judge is built from the base, in this run: the base's image with
# the base's contract (the entrypoint takes .lights-out/ from the base,
# docs/adr/0033), so a change never runs the gates it rewrites. The
# verdict is the step's line, the run's summary and a check run named
# "lights-out gates" on the commit. GitHub-only: the L0 Gitea runner reads
# this directory too and holds the engine socket (docs/adr/0039).
name: self

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # docs/adr/0065: whether this push is judged here (a commit already green
  # on a branch is not judged again on main) and how much of it (a
  # docs-only push skips the heavy jobs). Every other job needs it.
  plan:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/plan.sh
          sparse-checkout-cone-mode: false
      - id: plan
        run: sh .github/plan.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}

  gates:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # docs/adr/0074: a push is judged from its last green ancestor, and
      # mutation skips the lines of the trees a sound recorded green
      # already judged; a pull request keeps its base (HEAD is GitHub's
      # merge commit, HEAD^1 the base branch).
      - name: The range, and the judge built from its base
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sh .github/range.sh
            base=$(sed -n 's/^base=//p' "$GITHUB_OUTPUT" | tail -n 1)
          else
            base=$(git rev-parse HEAD^1)
            printf 'base=%s\njudged=\n' "$base" >> "$GITHUB_OUTPUT"
          fi
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          git worktree add -q --detach "$RUNNER_TEMP/judge" "$base"
          sh "$RUNNER_TEMP/judge/package/build.sh" docker localhost/lights-out:judge
      - name: lights-out gates on this change
        uses: ./
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          judged: ${{ steps.range.outputs.judged }}
          image: localhost/lights-out:judge
