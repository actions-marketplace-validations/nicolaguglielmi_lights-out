name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # GitHub-only (docs/adr/0039): at L0 the CI leg is core/steps/ci.sh, and
  # ./go demo runs ./go ci itself. Since docs/adr/0060 §6 no runner reads
  # this file locally; the guards on every job are inert.
  ci:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go ci

  # Host-side gate (docs/adr/0004 point 4, docs/adr/0012 §5): needs a real
  # engine on the runner, which Gitea Actions' job containers do not have.
  # docs/adr/0013 §7: runs the whole M3 path (./go demo, engine-compat then
  # the cold-to-rollback demo), so the canonical stranger — a fresh runner —
  # measures it on every push.
  engine-compat:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go demo
        env:
          CONTAINER_ENGINE: docker
      # The logbook of the demo just run (docs/adr/0047 §4, provisional
      # decision 13): the source of console/snapshot/logbook.json, printed
      # here and uploaded below. Not part of ./go demo: the demo is unchanged.
      - run: ./go logbook LOGBOOK_FILE=.crew/logbook-demo.json && cat .crew/logbook-demo.json
        env:
          CONTAINER_ENGINE: docker
      # M29's done-when (docs/adr/0055 §6, §7): in the logbook the console
      # reads, ticket 0001's one timeline runs from `requested` to the
      # rollback, and its kanban card sits in the rolled-back column.
      - name: ticket 0001 from requested to rollback
        run: |
          jq -e '.tickets[] | select(.id == "0001")
            | (.timeline[0].phase == "request") and (.timeline[-1].phase == "outcome") and (.timeline[-1].verdict == "NO-GO")
            and ([.timeline[].phase] | index("spec") != null) and .state == "rolled-back"' .crew/logbook-demo.json
          jq -e '[.kanban[] | select(.tickets | index("0001")) | .state] == ["rolled-back"]' .crew/logbook-demo.json
          jq -r '.tickets[] | select(.id == "0001") | .timeline[] | "\(.phase)\t\(.verdict // "-")\t\(.line // "" | .[0:100])"' .crew/logbook-demo.json
      # The console over that logbook in snapshot mode, on the runner's own
      # Python (the console is standard library), and one screenshot per
      # screen with the runner's preinstalled Chrome. Evidence for a human,
      # not a check: ci/logbook.sh and demo-console are the checks.
      - name: console screenshots
        continue-on-error: true
        run: |
          CONSOLE_SNAPSHOT=.crew/logbook-demo.json CONSOLE_LISTEN=8098 python3 console/serve.py &
          sleep 2
          mkdir -p console-shots
          for s in overview kanban tickets ticket/0001 incidents launch thresholds; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1280,1400 --virtual-time-budget=5000 \
              --screenshot="console-shots/$(printf '%s' "$s" | tr / -).png" "http://localhost:8098/#$s"
          done
          ls -l console-shots
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-snapshot
          path: |
            .crew/logbook-demo.json
            console-shots/
          if-no-files-found: warn
      # The tower's documents outlive the plane (docs/adr/0060 §1, §8): down
      # and up again, and the logbook of the demo regenerates byte for byte.
      - name: the logbook survives ./go down and ./go up
        run: |
          ./go down && ./go up
          ./go logbook LOGBOOK_FILE=.crew/logbook-restarted.json
          cmp .crew/logbook-demo.json .crew/logbook-restarted.json
        env:
          CONTAINER_ENGINE: docker

  # Same shape as engine-compat: needs a real engine for the backend-test
  # image, and network for osv-scanner (docs/adr/0015 §7). GitHub-only until
  # M5 decides whether the Gitea runner's host mode gets the engine socket
  # (docs/adr/0012 consequences; docs/adr/0015 §7 names the trade-off).
  # demo-gates, not gates: it is the M4 acceptance command and needs no
  # BASE/HEAD from the caller, since it judges the six committed fixtures
  # against HEAD, not the pushed range itself.
  gates:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go demo-gates
        env:
          CONTAINER_ENGINE: docker

  # The console's interactions in a browser (docs/adr/0059 §5): the kanban
  # moves no card and sends no POST, a view survives in its link, the theme
  # changes no word, the editor's line is the spec gate's, the ADR search
  # finds an ADR by number, title word and file. Playwright is not in the
  # workbench, so this is a job and not a `./go ci` check; the image and the
  # pip install are site.yml's, so one pin moves both. GitHub-only like the
  # jobs above (docs/adr/0039). ci/console-ui.py prints the one gate line.
  console-ui:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    timeout-minutes: 15
    container:
      # Playwright 1.64.1 with Chromium and the Python package, the image
      # site.yml pins; the digest is the multi-arch index's.
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # core/map.py reads this repository's commit with git: the image may
      # not carry it, and the checkout belongs to another user than the job's.
      - name: git, and the workspace as a safe directory
        run: |
          command -v git >/dev/null 2>&1 || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git >/dev/null; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image bakes in the browsers, not the package that drives them:
      # the same version, so it finds them under /ms-playwright.
      - name: playwright from PyPI
        run: pip install --no-cache-dir --quiet playwright==1.64.1
      - run: python3 ci/console-ui.py

  # go-for-launch's proof (docs/adr/0020 §4): a held canary promoted to
  # 100% with the human answered by GO_FOR_LAUNCH=GO, then the un-promote.
  # Not a `demo` stage — plan §2's criterion is the rollback — so it runs
  # here on every push instead. Needs the plane: same shape as engine-compat.
  launch:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # demo-launch, like demo-rollback, runs against a plane already up.
      - run: ./go up
        env:
          CONTAINER_ENGINE: docker
      - run: ./go demo-launch
        env:
          CONTAINER_ENGINE: docker
      # M11's acceptance (docs/adr/0047 §4): the same hold, but the human
      # answer is an HTTP POST to a running console, which runs
      # core/promote.sh; then demo-launch's checks, `via: console` in the
      # record, and the un-promote. Same plane, no second boot.
      - run: ./go demo-console
        env:
          CONTAINER_ENGINE: docker
      # The CodeHost port's conformance suite (docs/adr/0043 §5) against the
      # plane's Gitea, the reference adapter: no new job and no second plane
      # boot, the plane is up. Gitea's bootstrap pushes this checkout's HEAD
      # to its main. The same suite runs against GitHub every night
      # (nightly-github.yml), so a red nightly with this step green points at
      # the GitHub adapter, not the suite.
      - run: ./go codehost-conformance
        env:
          CONTAINER_ENGINE: docker
      # The StateStore and EventBus suites (docs/adr/0060 §4) on the opt-in
      # emulator adapters: the same plane, the emulators added by naming
      # them; ./go ci runs the suites on sqlite and spool.
      - run: |
          ./go up EVENT_BUS=pubsub-emulator STATE_STORE=firestore-emulator
          ./go statestore-conformance STATE_STORE=firestore-emulator
          ./go eventbus-conformance EVENT_BUS=pubsub-emulator
        env:
          CONTAINER_ENGINE: docker
      # Envoy has failed to answer here on some cold runners and not others;
      # its log and the backend's are the evidence.
      - if: always()
        run: docker logs --tail 80 lights-out-envoy-1 || true; docker logs --tail 80 lights-out-backend-1 || true

  # The argo-rollouts Delivery adapter's proof (docs/adr/0051 §6): the six-
  # case conformance suite, unchanged, against a k3s node beside the plane.
  # Docker on the runner is rootful, which k3s in a container needs.
  argo:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go up
        env:
          CONTAINER_ENGINE: docker
      # KEEP_CLUSTER=1 leaves the node up for the evidence step below.
      - run: ./go argo-conformance KEEP_CLUSTER=1
        env:
          CONTAINER_ENGINE: docker
      # The node and the controller are the evidence when a case NO-GOes.
      - if: always()
        run: |
          docker logs --tail 80 lights-out-k8s-1 || true
          docker exec lights-out-k8s-1 kubectl get rollout,pods,svc,endpointslices -A -o wide || true
          docker exec lights-out-k8s-1 kubectl -n argo-rollouts logs deploy/argo-rollouts --tail 80 || true

  # M30's acceptance (docs/adr/0056 §7): two disjoint tickets merge without
  # re-judging, a third goes back to rework after a person's merge on its
  # perimeter, a merge that breaks main is bisected and reverted through
  # the plane's Gitea, and main is GO again. Brings the plane up itself.
  mainline:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go demo-mainline
        env:
          CONTAINER_ENGINE: docker
      # The rework loop (docs/adr/0038), on the plane demo-mainline left up:
      # no workflow ran it before docs/adr/0060 §8 asked for it unchanged.
      - run: ./go demo-rework
        env:
          CONTAINER_ENGINE: docker

  # The Workload port's own acceptance (docs/adr/0030 §7), and attach's
  # since M13 (docs/adr/0037 §10): workloads/minimal/ copied into a fresh
  # git repository, attached, then down, up, smoke, verify, demo-rollback,
  # demo-gates, down on it instead of app/. Same shape as launch: needs the plane, GitHub-only until M5
  # decides the Gitea runner's own engine access (docs/adr/0012
  # consequences).
  seam:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go demo-seam
        env:
          CONTAINER_ENGINE: docker

  # M20's acceptance (docs/adr/0042 §10): attach, init and gates on the
  # two example repositories without the plane, the draft judged with no
  # engine at all, timed against plan §16's 300 s. Needs the engine for
  # the committed contracts' run (compose and image forms), not the plane.
  init:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go demo-init
        env:
          CONTAINER_ENGINE: docker

  # Every CLI harness's entry requirement (docs/adr/0041 §8): its image
  # built, its run.sh driven nine ways against a scripted model, with no
  # key. The engine half of the suite; its engine-free half (ci/harness-
  # shape.sh, ci/hooks.sh) is in `./go ci`, which has no socket by design.
  # GitHub-only like every job that needs a real engine: the L0 Gitea
  # runner's one job is image (docs/adr/0039).
  harness-conformance:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./go harness-conformance
        env:
          CONTAINER_ENGINE: docker
