# The reference engine, rootless podman, on the harness boundary
# (docs/adr/0046): `./go harness-conformance` for one harness, case 9 the
# one that matters here (the internal `crew` network, the egress proxy,
# DNS from an internal network under aardvark-dns). claude-code only: the
# confinement is compose's and the proxy's, the same for every harness,
# and one CLI image keeps the job short. A workflow of its own, so a
# runner-side podman problem shows here without turning `ci` red; its
# result is read and reported, never ignored. GitHub-only (docs/adr/0039).
name: podman

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # docs/adr/0065: whether this push is judged here (a commit already green
  # on a branch is not judged again on main) and how much of it (a
  # docs-only push skips the heavy jobs). Every other job needs it.
  plan:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/plan.sh
          sparse-checkout-cone-mode: false
      - id: plan
        run: sh .github/plan.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}

  harness-conformance-podman:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ./go hands workbench podman's API socket; the runner does not start
      # it. The user unit first, a foreground-less service as the fallback.
      - run: |
          podman --version
          systemctl --user enable --now podman.socket || { nohup podman system service --time=0 >/tmp/podman-service.log 2>&1 & sleep 3; }
          podman info --format 'socket {{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}} network={{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}'
      - run: ./go harness-conformance CONFORMANCE_HARNESS=claude-code
        env:
          CONTAINER_ENGINE: podman

  # docs/adr/0072 §3 on the reference engine: the same `./go demo-dast` as
  # ci.yml's dast job, on rootless podman, for the cold pull of the scanner
  # and the scans measured on both engines, five stable-against-itself runs
  # as there.
  dast-podman:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          podman --version
          systemctl --user enable --now podman.socket || { nohup podman system service --time=0 >/tmp/podman-service.log 2>&1 & sleep 3; }
      - run: ./go up
        env:
          CONTAINER_ENGINE: podman
      - run: ./go demo-dast DAST_RUNS=5
        env:
          CONTAINER_ENGINE: podman
