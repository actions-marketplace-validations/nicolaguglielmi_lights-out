name: Something failed
description: A ./go command did not do what the README says.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with any variables you set.
      placeholder: ./go demo
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Last 30 lines of output
      description: Remove anything private first. `.env` never belongs here.
      render: text
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Machine and engine
      description: OS, `podman --version` or `docker --version`, and the engine's memory.
      placeholder: macOS 15, podman 5.6, machine with 6 GiB
    validations:
      required: true
  - type: dropdown
    id: retried
    attributes:
      label: Did `./go down` and a second run change anything?
      options:
        - Not tried
        - Same failure
        - It passed the second time
    validations:
      required: true
